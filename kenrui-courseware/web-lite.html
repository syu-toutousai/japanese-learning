<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>兼類詞 ・ 两刀ポケット</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1c2333;--sub:#5b6478;--line:#e4e7f0;
--acc:#4f6ef7;--acc2:#eef1ff;--ok:#188a52;--okbg:#e9f7ef;--ng:#d33f49;--ngbg:#fdecee;
--gold:#b8860b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--ink);padding-bottom:90px}
header{background:linear-gradient(135deg,#5f3dc4,#845ef7);color:#fff;padding:26px 20px 20px}
header h1{font-size:25px} header .kana{opacity:.92;font-size:14px;margin-top:6px}
header .tags span{display:inline-block;background:rgba(255,255,255,.22);
border-radius:99px;padding:2px 10px;font-size:12px;margin:10px 6px 0 0}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
nav{display:flex;gap:8px;margin:-18px 0 16px;position:relative;z-index:2}
nav button{flex:1;border:none;border-radius:12px;padding:12px 2px;font-size:14px;cursor:pointer;
background:var(--card);box-shadow:0 2px 10px rgba(30,40,90,.08);color:var(--sub);font-weight:600}
nav button.on{background:var(--ink);color:#fff}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;
box-shadow:0 2px 10px rgba(30,40,90,.06)}
.jp{font-size:16.5px;line-height:1.7;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif}
.cn{font-size:13.5px;color:var(--sub);margin-top:3px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:none}
.btn{flex:none;width:34px;height:34px;border-radius:50%;border:none;background:var(--acc2);
color:var(--acc);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn.playing{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.18);background:var(--acc);color:#fff}}
/* intro */
.intro{background:linear-gradient(135deg,#f1ebff,#f7f1ff)}
.intro h2{font-size:17px;margin-bottom:8px;color:#5f3dc4}
.intro p{font-size:14px;line-height:1.75}
.steps{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.steps div{flex:1;min-width:180px;background:#fff;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.6;
box-shadow:0 1px 6px rgba(30,40,90,.07)}
.steps b{color:#7048e8}
/* group & mini cards */
.grp{margin-bottom:16px}
.grp-h{color:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline}
.grp-h h3{font-size:16.5px}.grp-h span{font-size:12px;opacity:.9}
.mini-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px 0 2px}
.mini{background:#fff;border-radius:14px;padding:12px 10px;cursor:pointer;text-align:left;border:2px solid transparent;
box-shadow:0 1px 6px rgba(30,40,90,.08);transition:.15s}
.mini:hover{transform:translateY(-2px);border-color:var(--g,#0ca678)}
.mini .em{font-size:26px}
.mini .nm{font-weight:800;font-size:16px;margin:4px 0 2px}
.mini .im{font-size:11.5px;color:var(--sub);line-height:1.55}
/* detail cards */
.noun{scroll-margin-top:70px;border-left:5px solid var(--g,#0ca678)}
.noun h2{font-size:19px}
.noun h2 .jl{float:right;font-size:11px;background:#f1f3f8;color:var(--sub);
border-radius:99px;padding:2px 10px;font-weight:600}
.meta{display:flex;align-items:center;gap:8px;margin:8px 0 2px;flex-wrap:wrap}
.meta code{background:#f2f4fa;border:1px solid var(--line);color:var(--ink);
border-radius:8px;padding:2px 9px;font-size:12px}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700}
.chip.pfx{background:#e7f1ff;color:#1971c2}
.chip.sfx{background:#fff0e6;color:#e8590c}
.mini-btn{width:26px;height:26px;font-size:12px}
.meanbox{background:var(--g-bg,#eef1ff);border-radius:12px;padding:10px 13px;font-size:14px;line-height:1.7;margin:10px 0}
.note{font-size:13px;color:var(--gold);margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;line-height:1.65}
h3.sec{font-size:15px;color:var(--sub);margin:16px 0 8px;font-weight:600}
/* quiz */
.q{font-size:16.5px;line-height:1.75;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;font-size:15.5px;
border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--ng);background:var(--ngbg)}
.opt:disabled{cursor:default;opacity:.92}
.exp{margin-top:10px;padding:11px 13px;border-radius:10px;font-size:14px;line-height:1.65}
.exp.ok{background:var(--okbg);color:var(--ok)} .exp.ng{background:var(--ngbg);color:var(--ng)}
.judgebtns{display:flex;gap:12px}
.judgebtns .opt{flex:1;text-align:center;font-size:18px}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);
box-shadow:0 -2px 12px rgba(30,40,90,.09);padding:10px 16px;z-index:5}
.bar .wrap{display:flex;justify-content:space-between;align-items:center}
.score{font-weight:700;color:var(--acc)} .next{border:none;background:var(--acc);color:#fff;
border-radius:10px;padding:10px 22px;font-size:15px;cursor:pointer}
.next[disabled]{opacity:.35;cursor:default}
.fin{text-align:center;padding:30px 10px}
.fin .big{font-size:44px;font-weight:800;color:var(--acc)}
.hint{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.6}
code.inline{background:#eceff7;border-radius:6px;padding:1px 7px;font-size:.92em}
/* source badges */
.src{display:inline-block;border-radius:99px;padding:1px 8px;font-size:10.5px;font-weight:700;
margin-left:6px;vertical-align:1px}
.src-moji{background:var(--okbg);color:var(--ok)}
.src-nade{background:#ede7f6;color:#5e35b1}
/* nadeshiko scene */
.nade-card{background:#faf5ff;border:1px solid #e0d0f0;border-radius:12px;padding:12px;margin:10px 0}
.nade-card .nade-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.nade-card .nade-media{font-weight:700;color:#5e35b1;font-size:13px}
.nade-card .nade-ep{font-size:11.5px;color:var(--sub)}
.nade-card .nade-jp{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif;
font-size:15.5px;line-height:2}
.nade-card .nade-jp ruby rt{font-size:.52em;color:var(--sub)}
.nade-card .nade-en{font-size:12.5px;color:var(--sub);margin-top:3px;font-style:italic}
.nade-card .nade-cn{font-size:13px;color:var(--ink);margin-top:2px}
.nade-card .nade-row{display:flex;gap:10px;align-items:flex-start}
.nade-card .nade-thumb{width:84px;height:52px;border-radius:8px;object-fit:cover;flex:none}
.nade-card a{color:#5e35b1;font-size:11.5px;text-decoration:none}
.nade-card a:hover{text-decoration:underline}
</style>
</head>

const ITEMS=[{"id": "iyami", "word": "嫌み", "read": "いやみ", "group": "story", "level": "N2", "emoji": "😒", "meaning": "讽刺、挖苦、带刺的话；讨人厌", "na": "嫌みな＋言い方／態度", "examples": [{"jp": "彼はいつも嫌みな言い方をして、場の空気を悪くする。", "cn": "他说话总是带刺，把气氛搞僵。"}, {"jp": "その嫌みな笑い方は、誰が聞いても気分が悪い。", "cn": "那种阴阳怪气的笑法，谁听了都不舒服。"}], "nadeshiko": [{"jp": "嫌みな連中には 嫌みなヤツが効くってことね", "en": "but I guess when it comes to obnoxious jerks, it takes one to beat one.", "cn": "对刻薄的家伙，就得用刻薄的人来治。", "media": "キルラキル", "ep": "EP14", "at": "10:11", "url": "https://nadeshiko.co/en/sentence/WX27M0iPTMaq", "audio": "https://cdn.nadeshiko.co/media/18679/14/64bdb6dbf2.mp3", "thumb": "https://cdn.nadeshiko.co/media/18679/14/64bdb6dbf2.webp"}, {"jp": "ハハハ 嫌みはやめなさい", "en": "You can skip the sarcasm.", "cn": "哈哈哈，少说这种阴阳怪气的话。", "media": "安達としまむら", "ep": "EP6", "at": "14:12", "url": "https://nadeshiko.co/en/sentence/oqnrRY-uZDz-", "audio": "https://cdn.nadeshiko.co/media/109287/6/db2648d7d4.mp3", "thumb": "https://cdn.nadeshiko.co/media/109287/6/db2648d7d4.webp"}], "note": "「嫌み」本是名词（嫌みを言う＝说风凉话），な 化已近词典级。与嫌がらせ的“动手整人”相比，嫌み 偏言语上的酸。"}, {"id": "konomi", "word": "好み", "read": "このみ", "verb": "好む", "group": "story", "level": "N2", "emoji": "👌", "meaning": "喜好、偏好、中意的类型", "na": "好みの〜／好みな〜（の・な皆可）", "examples": [{"jp": "あなたの好みのタイプを教えてください。", "cn": "请告诉我你喜欢的类型。"}, {"jp": "好みな色を選んでもらってかまわないよ。", "cn": "挑你喜欢的颜色就行。"}], "nadeshiko": [{"jp": "好みじゃないから...", "en": "They're not to my taste.", "cn": "因为不合我的口味嘛……", "media": "ぼっち・ざ・ろっく！", "ep": "EP7", "at": "16:51", "url": "https://nadeshiko.co/en/sentence/wYpXVM2Yc7oQ", "audio": "https://cdn.nadeshiko.co/media/130003/7/8e21459e8e.mp3", "thumb": "https://cdn.nadeshiko.co/media/130003/7/8e21459e8e.webp"}, {"jp": "フフッ... 好みがあるしね。", "en": "People do have their own preferences.", "cn": "呵呵……毕竟各人有各人的喜好嘛。", "media": "僕の心のヤバイやつ 第2期", "ep": "EP7", "at": "11:49", "url": "https://nadeshiko.co/en/sentence/Cw3jYalYJvTS", "audio": "https://cdn.nadeshiko.co/media/166216/7/05803f07aa.mp3", "thumb": "https://cdn.nadeshiko.co/med .co/media/21776/7/8b5f010ab0.mp3", "thumb": "https://cdn.nadeshiko.co/media/21776/7/8b5f010ab0.webp"}, {"jp": "アーニャ お買い得だよ", "en": "Pwease! I'm a good bargain!", "cn": "买阿尼亚很划算的哦！", "media": "SPY×FAMILY", "ep": "EP1", "at": "9:35", "url": "https://nadeshiko.co/en/sentence/WK_72LdmWc5y", "audio": "https://cdn.nadeshiko.co/media/140960/1/8563b50a92.mp3", "thumb": "https://cdn.nadeshiko.co/media/140960/1/8563b50a92.webp"}], "note": "「買い得」本已是词典级な化（買い得バーゲン）；再加お 美化前缀后仍能な化——双重两位一体的两刀词。"}, {"id": "migotae", "word": "見応え", "read": "みごたえ", "group": "shakai", "level": "N2", "emoji": "🎬", "meaning": "有看头、值得一看", "na": "見応えのある〜（主流）；見応えな〜（较少）", "examples": [{"jp": "最近の大会は見応えのある試合が続いている。", "cn": "最近的赛事接连都是很有看头的比赛。"}, {"jp": "あの映画は見応えバツグンだよ。一度は見てみて。", "cn": "那部电影超有看头，值得去看一次。"}], "nadeshiko": [{"jp": "見応えのある攻防です", "en": "Exciting offensive and defensive battle!", "cn": "真是一场有看头的攻防战。", "media": "はじめの一歩 THE FIGHTING!", "ep": "EP32", "at": "17:32", "url": "https://nadeshiko.co/en/sentence/dNT931rz1v-v", "audio": "https://cdn.nadeshiko.co/media/263/32/79c35352ee.mp3", "thumb": "https://cdn.nadeshiko.co/media/263/32/79c35352ee.webp"}, {"jp": "見応えのある戦いだったな", "en": "That was quite the spectacular battle.", "cn": "真是一场有看头的战斗。", "media": "魔都精兵のスレイブ", "ep": "EP12", "at": "7:10", "url": "https://nadeshiko.co/en/sentence/--rSN7sZPCry", "audio": "https://cdn.nadeshiko.co/media/141821/12/c42734a1f1.mp3", "thumb": "https://cdn.nadeshiko.co/media/141821/12/c42734a1f1.webp"}], "note": "主流是「見応えのある／見応えがある」；「見応えな」少用。同族还有読みごたえ・聴きごたえ・やりごたえ。"}, {"id": "oazuke", "word": "お預け", "read": "おあずけ", "verb": "預ける", "group": "shakai", "level": "N2", "emoji": "⏳", "meaning": "暂缓、延期、被搁置（的状态）", "na": "お預けな＋状態", "examples": [{"jp": "楽しみにしていた旅行はお預けな状態が続いている。", "cn": "期待已久的旅行一直处于被搁置的状态。"}, {"jp": "昇進の話は当分お預けだ。", "cn": "升职的事暂时没戏了。"}], "nadeshiko": [{"jp": "まあ しばらく肉はお預けだ", "en": "Well, you'll need to stay away from meat for a while.", "cn": "那这段时间就先别碰肉了。", "media": "狼と香辛料 MERCHANT MEETS THE WISE WOLF", "ep": "EP13", "at": "9:21", "url": "https://nadeshiko.co/en/sentence/mUknQQE-iLAl", "audio": "https://cdn.nadeshiko.co/media/145728/13/beda6104a3.mp3", "thumb": "https://cdn.nadeshiko.co/media/145728/13/beda6104a3.webp"}, {"jp": "まあ「えっち」は お預けってことで", "en": "Well, we can save the sex for another time.", "cn": "至于那档子事，就先押后再说。", "media": "彼女、お借りします 第2期", "ep": "EP4", "at": "20:54", "url": "https://nadeshiko.co/en/sentence/Yn_5QZCPRIMV", "audio": "https://cdn.nadeshiko.co/media/124410/4/c4acb2bc61.mp3", "thumb": "https://cdn.nadeshiko.co/media/124410/4/c4acb2bc61.webp"}], "note": "「お預け」原＝暂存、代管（狗的口头禅お預け）。な 配「状態」是典型用例；另有惯用「お預けを食う＝被放鸽子」。"}, {"id": "machigai", "word": "間違い", "read": "まちがい", "verb": "間違える", "group": "machigai", "level": "N2", "emoji": "❌", "meaning": "错误、失误（な．“错误的”，新兴口语）", "na": "間違いな＋選択／判断（新兴）", "examples": [{"jp": "間違いな選択をしたのは認めるつもりだ。", "cn": "我承认做了个错误的选择。"}, {"jp": "あれは明らかに間違いだと分かるミスだった。", "cn": "那是一个一眼就能看出是错的失误。"}], "nadeshiko": [{"jp": "フフッ... 間違いない!", "en": "There's no mistake!", "cn": "嘿嘿……绝对没错！", "media": "ドラゴンボールDAIMA", "ep": "EP16", "at": "16:42", "url": "https://nadeshiko.co/en/sentence/7GzlnDD0nooZ", "audio": "https://cdn.nadeshiko.co/media/170083/16/bb71bdceb1.mp3", "thumb": "https://cdn.nadeshiko.co/media/170083/16/bb71bdceb1.webp"}, {"jp": "ごめ ちょっと これ間違い!", "en": "Sorry, that's not it! I messed up!", "cn": "抱歉，这个搞错了！", "media": "男女の友情は成立する？（いや、 しないっ!!）", "ep": "EP4", "at": "17:49", "url": "https://nadeshiko.co/en/sentence/RE3oc83VhYUx", "audio": "https://cdn.nadeshiko.co/media/153554/4/5b21fc1884.mp3", "thumb": "https://cdn.nadeshiko.co/media/153554/4/5b21fc1884.webp"}], "note": "な 化的标准形是「間違った選択」「誤った判断」——判断“错”往往用連用形＋助動詞「た」（間違った）而非形容動詞（間違いな）；「間違いな」是新興口语。"}, {"id": "kanchigai", "word": "勘違い", "read": "かんちがい", "verb": "勘違いする", "group": "machigai", "level": "N2", "emoji": "🤔", "meaning": "误会、误解、（自作多情的）误想", "na": "勘違いな＋思い込み", "examples": [{"jp": "それは勘違いな思い込みだから、一度確かめたほうがいいよ。", "cn": "那是你一厢情愿的误会，最好去核实一下。"}, {"jp": "彼に優しくされただけなのに、勘違いしてしまった。", "cn": "他只是对我好一点，我竟自作多情了。"}], "nadeshiko": [{"jp": "勘違いメンヘラ野郎ども...。", "en": "Well, those nutjobs have it all wrong!", "cn": "一群脑补过头的神经病……", "media": "Re:ゼロから始める異世界生活 3rd season", "ep": "EP6", "at": "19:08", "url": "https://nadeshiko.co/en/sentence/_Y05KL1hDKGr", "audio": "https://cdn.nadeshiko.co/media/163134/6/7203e74829.mp3", "thumb": "https://cdn.nadeshiko.co/media/163134/6/7203e74829.webp"}, {"jp": "えっ... とんだ勘違いだ", "en": "This is a huge misunderstanding!", "cn": "啊……误会可大了。", "media": "Re:ゼロから始める異世界生活", "ep": "EP12", "at": "28:17", "url": "https://nadeshiko.co/en/sentence/atsZTW-QqGnT", "audio": "https://cdn.nadeshiko.co/media/21355/12/6440900eff.mp3", "thumb": "https://cdn.nadeshiko.co/media/21355/12/6440900eff.webp"}], "note": "名词主导（勘違いをする）；「勘違いな思い込み」＝把“想当然的误解”贴上贬值标签。"}, {"id": "sujichigai", "word": "筋違い", "read": "すじちがい", "verb": "筋が違う", "group": "machigai", "level": "N1", "emoji": "😵", "meaning": "荒唐、不合情理；找错对象", "na": "筋違いな＋苦情／発言", "examples": [{"jp": "筋違いな苦情を受けて、担当者は呆れていた。", "cn": "收到无理取闹的投诉，负责人无语了。"}, {"jp": "そういう話を私に持ち込むのは筋が違うよ。", "cn": "这种事找我讲，根本就是找错了人。"}], "nadeshiko": [{"jp": "でも それは筋違いだろう", "en": "That was wrong of me.", "cn": "可那是找错对象了。", "media": "狼と香辛料 MERCHANT MEETS THE WISE WOLF", "ep": "EP10", "at": "6:02", "url": "https://nadeshiko.co/en/sentence/eld5F-M7217K", "audio": "https://cdn.nadeshiko.co/media/145728/10/d405446aac.mp3", "thumb": "https://cdn.nadeshiko.co/media/145728/10/d405446aac.webp"}, {"jp": "二人を責めるのは筋違いだよ", "en": "so don't blame them.", "cn": "责怪那两个人可不讲道理啊。", "media": "偽物語", "ep": "EP4", "at": "1:57", "url": "https://nadeshiko.co/en/sentence/wgQd4E3eYCXK", "audio": "https://cdn.nadeshiko.co/media/11597/4/6e717b2b88.mp3", "thumb": "https://cdn.nadeshiko.co/media/11597/4/6e717b2b88.webp"}], "note": "词典级な化（筋違いな要求・筋違いな批判）。“道理对不上号”的否定标签，常指责对方荒唐。"}, {"id": "bachigai", "word": "場違い", "read": "ばちがい", "verb": "場が違う", "group": "machigai", "level": "N2", "emoji": "🎩", "meaning": "不合场合、不合时宜", "na": "場違いな＋服装／発言", "examples": [{"jp": "こんな場違いな服を着てきてしまって恥ずかしい。", "cn": "穿这么不合场合的衣服就来了，好丢人。"}, {"jp": "彼の冗談はこの会議には場違いだ。", "cn": "他的玩笑在这种会议上很不合时宜。"}], "nadeshiko": [{"jp": "なぜ こんな場違いなところに", "en": "What am I doing here?", "cn": "为什么会出现在这种格格不入的地方。", "media": "履いてください、鷹峰さん", "ep": "EP4", "at": "5:29", "url": "https://nadeshiko.co/en/sentence/dzS8z_4e9zLO", "audio": "https://cdn.nadeshiko.co/media/179965/4/235d0ecb21.mp3", "thumb": "https://cdn.nadeshiko.co/media/179965/4/235d0ecb21.webp"}, {"jp": "私が 一番 場違いですね", "en": "I'm the most out of place in the end.", "cn": "最不合时宜的，说到底是我呢。", "media": "サイレント・ウィッチ 沈黙の魔女の隠しごと", "ep": "EP6", "at": "16:34", "url": "https://nadeshiko.co/en/sentence/GWSLCu588iad", "audio": "https://cdn.nadeshiko.co/media/179966/6/af5a259925.mp3", "thumb": "https://cdn.nadeshiko.co/media/179966/6/af5a259925.webp"}], "note": "词典级。評价“场合・空气对不上号”：婚礼上穿牛仔裤＝場違いな服。"}, {"id": "karamawari", "word": "空回り", "read": "からまわり", "verb": "空回りする", "group": "machigai", "level": "N1", "emoji": "🎡", "meaning": "白忙、徒劳、原地打转", "na": "空回りな＋努力（口语新兴）", "examples": [{"jp": "空回りな努力を続けるより、方向を確かめたほうがいい。", "cn": "与其瞎忙，不如先确认方向。"}, {"jp": "彼の説得は空回りに終わった。", "cn": "他的劝说以白费口舌告终。"}], "nadeshiko": [{"jp": "私の人生 空回りばっかり... ん?", "en": "I'm always spinning my wheels.", "cn": "我的人生净是在原地打转……嗯？", "media": "ひそねとまそたん", "ep": "EP5", "at": "18:25", "url": "https://nadeshiko.co/en/sentence/1BAJMmmZMaWB", "audio": "https://cdn.nadeshiko.co/media/100673/5/3df9249b5f.mp3", "thumb": "https://cdn.nadeshiko.co/media/100673/5/3df9249b5f.webp"}, {"jp": "お前 空回りしてんの気付いてる?", "en": "Haven't you realized you're achieving nothing?", "cn": "你发现自己一直在做无用功了吗？", "media": "SHIROBAKO", "ep": "EP22", "at": "15:19", "url": "https://nadeshiko.co/en/sentence/cC2ufRzDkXjn", "audio": "https://cdn.nadeshiko.co/media/20812/22/7c25bc03af.mp3", "thumb": "https://cdn.nadeshiko.co/media/20812/22/7c25bc03af.webp"}], "note": "名词主导（空回りする）；「空回りな努力」为口语・网络新兴，写作可用無駄な努力代偿。"}, {"id": "ihou", "word": "違法", "read": "いほう", "verb": "違法（する）", "group": "sahen", "level": "N3", "emoji": "🚫", "meaning": "违法、非法的", "na": "違法な＋行為／アップロード", "examples": [{"jp": "違法なアップロードは絶対にしないでください。", "cn": "请绝对不要进行违法上传。"}, {"jp": "それは法律上、完全に違法な行為です。", "cn": "那是法律上完全违法的行为。"}], "nadeshiko": [{"jp": "ドラゴンの 違法飼育?", "en": "Illegal breeding of dragons?", "cn": "非法饲养龙？", "media": "BURN THE WITCH", "ep": "EP2", "at": "1:14", "url": "https://nadeshiko.co/en/sentence/VLUyNQs5LgH-", "audio": "https://cdn.nadeshiko.co/media/116673/2/25372d6abc.mp3", "thumb": "https://cdn.nadeshiko.co/media/116673/2/25372d6abc.webp"}, {"jp": "どうぞ 違法なものは やめとけよ", "en": "All yours. Quit it with the illegal stuff.", "cn": "请便。违法的事趁早别干啊。", "media": "シュタインズ・ゲート ゼロ", "ep": "EP16", "at": "8:26", "url": "https://nadeshiko.co/en/sentence/FOiSCbamJTut", "audio": "https://cdn.nadeshiko.co/media/21127/16/734d7319cf.mp3", "thumb": "https://cdn.nadeshiko.co/media/21127/16/734d7319cf.webp"}], "note": "漢語サ變名詞转性质标签的典型。「違法な〜」＝“贴上法律标签”。"}, {"id": "meiwaku", "word": "迷惑", "read": "めいわく", "verb": "迷惑する", "group": "sahen", "level": "N3", "emoji": "🙏", "meaning": "打扰、添麻烦、恼人", "na": "迷惑な＋行為／電話", "examples": [{"jp": "深夜の電話は迷惑な行為だと思いませんか。", "cn": "半夜打电话，难道不觉得打扰人吗？"}, {"jp": "ご迷惑をおかけして申し訳ありません。", "cn": "给您添麻烦了，非常抱歉。"}], "nadeshiko": [{"jp": "ぐっ... めっちゃ迷惑かかってる", "en": "I'm causing problems for her again!", "cn": "唔……又给人添了大麻烦。", "media": "彼女、お借りします 第2期", "ep": "EP6", "at": "20:05", "url": "https://nadeshiko.co/en/sentence/sQLzhKdMRgCs", "audio": "https://cdn.nadeshiko.co/media/124410/6/22d8c1c956.mp3", "thumb": "https://cdn.nadeshiko.co/media/124410/6/22d8c1c956.webp"}, {"jp": "ホ... ホント 迷惑ですから!", "en": "Really! That's so embarrassing!", "cn": "真……真的太不好意思了！", "media": "斉木楠雄のΨ難 2", "ep": "EP11", "at": "12:10", "url": "https://nadeshiko.co/en/sentence/Nta2gv03sgCd", "audio": "https://cdn.nadeshiko.co/media/98034/11/7a69b46bf1.mp3", "thumb": "https://cdn.nadeshiko.co/media/98034/11/7a69b46bf1.webp"}], "note": "词典级。迷惑を掛ける（添麻烦）是名词面；「迷惑な」把行为定性为“烦人”。"}, {"id": "muri", "word": "無理", "read": "むり", "verb": "無理する", "group": "sahen", "level": "N3", "emoji": "💪", "meaning": "勉强、强求、不可能", function rowHTML(sid){
  const s=SENTS[sid];
  const b=AUDIO[sid]?`<button class="btn" onclick="play('${sid}',this)">▶</button>`:"";
  const chip=s.src==="moji"?`<span class="src src-moji">MOJi</span>`:"";
  return `<div class="row">${b}<div><div class="jp">${s.jp}${chip}</div><div class="cn">${s.cn}</div></div></div>`;
}
function nadeHTML(sc,iid,idx){
  const nid=`${iid}-n${idx}`;
  const hasAudio=!!NADE_AUDIO[nid];
  const playBtn=hasAudio?`<button class="btn" style="width:30px;height:30px;font-size:13px" onclick="play('${nid}',this)">▶</button>`:"";
  return `<div class="nade-card">
    <div class="nade-hdr"><span class="src src-nade">Nadeshiko</span>
      ${playBtn}
      <span class="nade-media">${sc.media}</span><span class="nade-ep">${sc.ep} @ ${sc.at}</span></div>
    <div class="nade-row">
      <img class="nade-thumb" src="${sc.thumb}" alt="" onerror="this.style.display='none'">
      <div>
        <div class="nade-jp">${sc.jp}</div>
        <div class="nade-en">${sc.en}</div>
        <div class="nade-cn">${sc.cn}</div>
        <a href="${sc.url}" target="_blank">nadeshiko.co ↗</a>
      </div>
    </div></div>`;
}

/* ---------- tabs ---------- */
const TABS=[["list","🗺️ 一覧"],["detail","📖 詳細"],["quiz","🎯 クイズ"]];
let tab="list";
function renderNav(){
  $("#nav").innerHTML=TABS.map(([k,l])=>
    `<button class="${k===tab?'on':''}" onclick="goTab('${k}')">${l}</button>`).join("");
}
function goTab(k){tab=k;renderNav();render();window.scrollTo(0,0);}
function goDetail(iid){goTab('detail');setTimeout(()=>{const el=document.getElementById('n-'+iid);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},60);}

/* ---------- list ---------- */
function shortMean(m){return m.split(/[：:；;，,（(]/)[0];}
function renderList(){
  let h=`<div class="card intro"><h2>这是什么口袋？🎴</h2>
  <p>本口袋收集<code class="inline">动詞連用形（名词化）</code>以及部分<code class="inline">動作・状態名詞</code>——
  <b>它们本来当名词，却还能再接「な」当形容动词</b>（名詞・形容動詞の兼類詞）。
  遇到新词丢进 <code class="inline">kenrui.json</code> 照着加一条，跑 <code class="inline">python3 build.py</code>——
  卡片、发音、题库自动重新长出来。</p>
  <div class="steps">
    <div><b>黄金法则 ① 单纯动作 → 只能の</b><br>「翻訳の仕事」✓ 「翻訳な仕事」✗——强调“正在发生”的名词不加な。</div>
    <div><b>黄金法则 ② 变成属性/标签 → 能加な</b><br>おすすめ＝推荐这个动作→商品的属性：おすすめな商品 ✓。な是“贴标签”信号。</div>
    <div><b>黄金法则 ③ 新詞長得最快</b><br>口语/SNS/广告是温床：こだわりな設計、お気に入りな音楽。看到困惑词→丢进来解析。</div>
  </div></div>`;
  h+=GROUPS.map(g=>{
    const members=ITEMS.filter(n=>n.group===g.id);
    if(!members.length)return "";
    return `<div class="grp"><div class="grp-h" style="background:${g.color}"><h3>${g.name}</h3><span>${members.length} 词</span></div>
    <div class="mini-wrap">${members.map(n=>`
      <button class="mini" style="--g:${g.color}" onclick="goDetail('${n.id}')">
        <div class="em">${n.emoji||"📌"}</div>
        <div class="nm">${n.word} <small style="color:${g.color};font-size:10.5px">${n.level}</small></div>
        <div class="im">${shortMean(n.meaning)}</div></button>`).join("")}</div></div>`;
  }).join("");
  $("#main").innerHTML=h;
}

/* ---------- detail ---------- */
function renderDetail(){
  let h="";
  GROUPS.forEach(g=>{
    const members=ITEMS.filter(n=>n.group===g.id);
    if(!members.length)return;
    h+=`<h3 class="sec" style="border-left:4px solid ${g.color};padding-left:8px;color:${g.color}">${g.name}</h3>`;
    members.forEach(n=>{
      const iid=n.id;
      const verbChip=n.verb?`<span class="chip sfx" title="語源動詞">語源 ${n.verb}</span>`:"";
      h+=`<div class="card noun" id="n-${iid}" style="--g:${g.color};--g-bg:${g.color}14">
        <h2>${n.emoji||"📌"} ${n.word}<span class="jl">${n.level}</span></h2>
        <div class="meta"><span class="chip pfx">名・形動 兼類</span>
          ${verbChip}
          <code>读作 ${n.read}</code>
          ${AUDIO[iid]?`<button class="btn mini-btn" title="听词读音" onclick="play('${iid}',this)">▶</button>`:""}
        </div>
        <div class="meanbox">📌 <b>意思</b>　${n.meaning}${n.na?`<br>🅽🅰 <b>な-用法</b>　${n.na}`:""}</div>
        ${(n.examples||[]).map((_,i)=>rowHTML(`${iid}-e${i}`)).join("")}
        ${(n.nadeshiko&&n.nadeshiko.length)?`<h3 class="sec">🎬 原声台词</h3>`:""}
        ${(n.nadeshiko||[]).map((sc,i)=>nadeHTML(sc,iid,i)).join("")}
        ${n.note?`<div class="note">💡 ${n.note}</div>`:""}
      </div>`;
    });
  });
  $("#main").innerHTML=h;
}

/* ---------- quiz ---------- */
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
function lsGet(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function wrongBook(){return lsGet("kenrui-wrong",{})}
function addWrong(ref){const w=wrongBook();w[ref]=1;lsSet("kenrui-wrong",w);}
function delWrong(ref){const w=wrongBook();delete w[ref];lsSet("kenrui-wrong",w);}
function wrongCount(){return Object.keys(wrongBook()).length;}

let mode=null,pool=[],order=[],qi=0,correct=0,answered=false;
function countBank(key){return QS.filter(q=>q.bank===key).length;}
function renderQuizTab(){
  if(!mode){
    showNext(false);$("#score").textContent="";
    const rows=BANKS.filter(([k])=>countBank(k)>0).map(([k,label])=>
      `<button class="opt" style="max-width:400px;margin:0 auto 10px" onclick="startQuiz('${k}')">${label} · ${countBank(k)}問</button>`).join("");
    const wc=wrongCount();
    const customHint=countBank("custom")?"":"";
    const wrongRow=wc?`<button class="opt" style="max-width:400px;margin:0 auto 10px;border-color:var(--gold)" onclick="startQuiz('wrong')">📕 错题重练 · ${wc}問<br><span style="font-size:12px;color:var(--gold)">做对即移出错题本</span></button>`:
      `<div class="hint" style="margin-bottom:10px">错题本是空的——答错的题会自动收进来 📕</div>`;
    $("#main").innerHTML=`<div class="card" style="text-align:center;padding:28px 16px">
      <div style="font-size:19px;font-weight:700;margin-bottom:4px">选择训练关卡</div>
      <div class="hint" style="margin-bottom:18px">题目由 pocket.json 自动生成 · 词条越多题库越大 · 全部随机打乱</div>
      ${rows}${customHint}${wrongRow}
      <button class="opt" style="max-width:400px;margin:0 auto 10px" onclick="startQuiz('mix')">🎲 混合交错 · 全量随机<br><span style="font-size:12px;color:var(--sub)">跨词交错练习，记忆更牢固</span></button>
      ${wc?`<button class="opt" style="max-width:220px;margin:14px auto 0;font-size:13px;padding:8px" onclick="if(confirm('清空错题本？')){localStorage.removeItem('kenrui-wrong');renderQuizTab();}">🗑️ 清空错题本</button>`:""}
    </div>`;
    return;
  }
  startQuiz(mode);
}
function startQuiz(m){
  mode=m;
  if(m==="mix")pool=QS.slice();
  else if(m==="wrong"){const w=wrongBook();pool=QS.filter(q=>w[q.ref]);}
  else pool=QS.filter(q=>q.bank===m);
  order=shuffle(pool.map((_,x)=>x));
  qi=0;correct=0;answered=false;
  renderQ();
}
function curQ(){return pool[order[qi]];}
function renderQ(){
  const q=curQ();updateScore();
  let body="";
  if(q.type==="listen"){
    body=AUDIO[q.aid]?`<div style="text-align:center;margin:6px 0 14px">
      <button class="btn" style="width:56px;height:56px;font-size:24px;margin:auto" onclick="play('${q.aid}',this)">🔊</button>
      <div class="hint">可反复点击重听</div></div>`
      :`<div class="hint" style="text-align:center;margin-bottom:10px">（这条发音还没生成）</div>`;
  }
  let optHTML="";
  if(q.opts){
    optHTML=shuffle(q.opts.map((t,i)=>({t,ok:i===q.ans})))
      .map(o=>`<button class="opt" data-ok="${o.ok?1:0}" onclick="pick(this)">${o.t}</button>`).join("");
  }else{
    const truthy=q.ans===true;
    optHTML=`<div class="judgebtns">
      <button class="opt" data-ok="${truthy?1:0}" onclick="pick(this)">⭕ 正しい</button>
      <button class="opt" data-ok="${truthy?0:1}" onclick="pick(this)">❌ 間違い</button></div>`;
  }
  showNext(false);
  const label=mode==="mix"?"混合":mode==="wrong"?"错题本":(BANKS.find(([k])=>k===mode)||["",""])[1];
  $("#main").innerHTML=`<div class="card">
    <div class="hint">第 ${qi+1} 题 / 共 ${order.length} 题 · ${label}</div>
    <div class="q">${q.q}</div>${body}${optHTML}
    <div id="fb"></div></div>`;
}
function showNext(v){const b=$("#next");b.style.display=v?"inline-block":"none";b.disabled=!v;}
function pick(btn){
  if(answered)return;answered=true;
  const q=curQ();
  const ok=btn.dataset.ok==="1";
  if(ok)correct++;else addWrong(q.ref);
  if(ok&&mode==="wrong")delWrong(q.ref);
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.ok==="1")b.classList.add("right");});
  if(!ok)btn.classList.add("wrong");
  $("#fb").innerHTML=`<div class="exp ${ok?'ok':'ng'}">${ok?"⭕ 正解！":"❌ 惜しい！"} ${q.exp||""}</div>`;
  showNext(true);updateScore();
  window.scrollTo(0,document.body.scrollHeight);
}
function nextQ(){
  answered=false;qi++;
  if(qi>=order.length)finish();else renderQ();
}
function finish(){
  showNext(false);
  const total=order.length,pct=Math.round(correct/total*100);
  const msg=pct===100?"🏆 完璧！口袋又扎实了一分！":pct>=70?"👍 かなりいい！错题趁热打铁":"📖 詳細タブで復習してから再挑戦";
  $("#main").innerHTML=`<div class="card fin">
    <div class="big">${correct} / ${total}</div>
    <div style="font-size:20px;margin:12px 0">${msg}</div>
    <button class="next" style="display:inline-block;margin:4px" onclick="startQuiz('${mode}')">もう一度挑戦</button><br>
    <button class="opt" style="max-width:280px;margin:14px auto 0" onclick="backToBanks()">别的关卡选一选</button></div>`;
  $("#score").textContent="";$("#barinfo").textContent=`正确率 ${pct}%`;
  window.scrollTo(0,0);
}
function backToBanks(){mode=null;render();}
function updateScore(){$("#score").textContent=`✔ ${correct} / ${order.length}`;}

/* ---------- init ---------- */
function render(){
  if(tab!=="quiz")showNext(false);
  if(tab==="list")renderList();
  else if(tab==="detail")renderDetail();
  else renderQuizTab();
}
renderNav();render();
</script>
</body>
</html>
