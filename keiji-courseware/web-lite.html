<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1c2333;--sub:#5b6478;--line:#e4e7f0;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--ink);padding-bottom:90px}
header{background:linear-gradient(135deg,#0b6b4f,#0ca678);color:#fff;padding:26px 20px 20px}
header h1{font-size:25px} header .kana{opacity:.92;font-size:14px;margin-top:6px}
header .tags span{display:inline-block;background:rgba(255,255,255,.22);

.wrap{max-width:880px;margin:0 auto;padding:0 16px}
nav{display:flex;gap:8px;margin:-18px 0 16px;position:relative;z-index:2}
nav button{flex:1;border:none;border-radius:12px;padding:12px 2px;font-size:14px;cursor:pointer;
background:var(--card);box-shadow:0 2px 10px rgba(30,40,90,.08);color:var(--sub);font-weight:600}
nav button.on{background:var(--ink);color:#fff}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;
box-shadow:0 2px 10px rgba(30,40,90,.06)}
.jp{font-size:16.5px;line-height:1.7;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif}
.cn{font-size:13.5px;color:var(--sub);margin-top:3px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:none}
.btn{flex:none;width:34px;height:34px;border-radius:50%;border:none;background:var(--acc2);
color:var(--acc);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn.playing{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.18);background:var(--acc);color:#fff}}
/* intro */
.intro{background:linear-gradient(135deg,#e6fbf3,#f0fff9)}
.intro h2{font-size:17px;margin-bottom:8px;color:#0b6b4f}
.intro p{font-size:14px;line-height:1.75}
.steps{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.steps div{flex:1;min-width:180px;background:#fff;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.6;

.steps b{color:#0ca678}

.grp-h h3{font-size:16.5px}.grp-h span{font-size:12px;opacity:.9}
.mini-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px 0 2px}
.mini{background:#fff;border-radius:14px;padding:12px 10px;cursor:pointer;text-align:left;border:2px solid transparent;

.mini:hover{transform:translateY(-2px);border-color:var(--g,#0ca678)}
.mini .em{font-size:26px}
.mini .nm{font-weight:800;font-size:16px;margin:4px 0 2px}
.mini .im{font-size:11.5px;color:var(--sub);line-height:1.55}
/* detail cards */

.noun h2{font-size:19px}
.noun h2 .jl{float:right;font-size:11px;background:#f1f3f8;color:var(--sub);

.meta{display:flex;align-items:center;gap:8px;margin:8px 0 2px;flex-wrap:wrap}
.meta code{background:#f2f4fa;border:1px solid var(--line);color:var(--ink);

.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700}
.chip.pfx{background:#e7f1ff;color:#1971c2}
.chip.sfx{background:#fff0e6;color:#e8590c}
.mini-btn{width:26px;height:26px;font-size:12px}
.meanbox{background:var(--g-bg,#eef1ff);border-radius:12px;padding:10px 13px;font-size:14px;line-height:1.7;margin:10px 0}
.note{font-size:13px;color:var(--gold);margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;line-height:1.65}
h3.sec{font-size:15px;color:var(--sub);margin:16px 0 8px;font-weight:600}

.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;font-size:15.5px;

.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--ng);background:var(--ngbg)}
.opt:disabled{cursor:default;opacity:.92}
.exp{margin-top:10px;padding:11px 13px;border-radius:10px;font-size:14px;line-height:1.65}
.exp.ok{background:var(--okbg);color:var(--ok)} .exp.ng{background:var(--ngbg);color:var(--ng)}
.judgebtns{display:flex;gap:12px}
.judgebtns .opt{flex:1;text-align:center;font-size:18px}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);
box-shadow:0 -2px 12px rgba(30,40,90,.09);padding:10px 16px;z-index:5}
.bar .wrap{display:flex;justify-content:space-between;align-items:center}
.score{font-weight:700;color:var(--acc)} .next{border:none;background:var(--acc);color:#fff;
border-radius:10px;padding:10px 22px;font-size:15px;cursor:pointer}
.next[disabled]{opacity:.35;cursor:default}
.fin{text-align:center;padding:30px 10px}
.fin .big{font-size:44px;font-weight:800;color:var(--acc)}
.hint{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.6}
code.inline{background:#eceff7;border-radius:6px;padding:1px 7px;font-size:.92em}

.src{display:inline-block;border-radius:99px;padding:1px 8px;font-size:10.5px;font-weight:700;
margin-left:6px;vertical-align:1px}
.src-moji{background:var(--okbg);color:var(--ok)}
.src-nade{background:#ede7f6;color:#5e35b1}

.nade-card{background:#faf5ff;border:1px solid #e0d0f0;border-radius:12px;padding:12px;margin:10px 0}
.nade-card .nade-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.nade-card .nade-media{font-weight:700;color:#5e35b1;font-size:13px}
.nade-card .nade-ep{font-size:11.5px;color:var(--sub)}
.nade-card .nade-jp{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif;

.nade-card .nade-cn{font-size:13px;color:var(--ink);margin-top:2px}
.nade-card .nade-row{display:flex;gap:10px;align-items:flex-start}

.nade-card a{color:#5e35b1;font-size:11.5px;text-decoration:none}

\/ruby>る", "en": "You're saving me money on groceries again! I'll make jam!", "cn": "哎呀，伙食费又省下来了，我做果酱吧。", "media": "March comes in like a lion Season 2", "ep": "EP13", "at": "16:31", "url": "https://nadeshiko.co/en/sentence/ax6JPVHnRd3d", "audio": "https://cdn.nadeshiko.co/media/98478/13/5e9c45e5d0.mp3", "thumb": "https://cdn.nadeshiko.co/media/98478/13/5e9c45e5d0.webp"}], "quizzes": [{"type": "choice", "q": "今月は出張が多くて、（　）が予算を大幅に超えてしまった。", "opts": ["交通費", "交通料", "交通代"], "ans": 0, "exp": "消耗性开销用「費」：交通費・食費・光熱費。料＝服务费，代＝按次支付的款。"}]}, {"id": "dai2", "type": "suffix", "word": "〜代", "read": "だい", "group": "money", "level": "N4", "emoji": "💸", "meaning": "付出去的钱款：電気代、タクシー代、部屋代", "examples": [{"jp": "毎月の電気代が高くなりました。", "cn": "每个月的电费变贵了。"}, {"jp": "電気代やガス代が値上がりしたせいで、一人暮らしの負担が重くなった。", "cn": "因为电费、燃气费涨价，独自生活的负担变重了。"}, {"jp": "タクシー代を節約するために、終電を逃さないよう行動することにした。", "cn": "为了省下打车费，我决定行动时注意别错过末班车。"}, {"jp": "スマートフォンの機種代を分割で払っているうちに、総額が思った以上に膨らんだ。", "cn": "手机机身在分期付款的过程中，总额涨得超出预期。"}], "note": "水电电话等按月缴的账单习惯说代：ガス代、電話代。", "nadeshiko": [{"jp": "<ruby>電気代<rt>でんきだい<\/rt><\/ruby>2<ruby>倍<rt>ばい<\/rt><\/ruby>かー　エアコン1<ruby>度<rt>ど<\/rt><\/ruby><ruby>下<rt>さ<\/rt><\/ruby>げよ", "en": "The power bill doubled? I should ease up on the AC.", "cn": "电费翻倍了呀……空调调低一度吧。", "media": "Rent-a-Girlfriend", "ep": "EP10", "at": "19:06", "url": "https://nadeshiko.co/en/sentence/wWmXC0eeoH__", "audio": "https://cdn.nadeshiko.co/media/113813/10/b75229407d.mp3", "thumb": "https://cdn.nadeshiko.co/media/113813/10/b75229407d.webp"}, {"jp": "タクシー<ruby>代<rt>だい<\/rt><\/ruby>は あかねに あとで<ruby>請求<rt>せいきゅう<\/rt><\/ruby>する", "en": "I'll charge Akane for the taxi fare later.", "cn": "打车费回头找茜报销。", "media": "Oshi No Ko", "ep": "EP7", "at": "5:50", "url": "https://nadeshiko.co/en/sentence/6ajPba4sDMEe", "audio": "https://cdn.nadeshiko.co/media/150672/7/c0ec8b2bf7.mp3", "thumb": "https://cdn.nadeshiko.co/media/150672/7/c0ec8b2bf7.webp"}], "quizzes": [{"type": "choice", "q": "エアコンをつけっぱなしにしたら、先月の電気（　）が倍になった。", "opts": ["代", "費", "料"], "ans /cdn.nadeshiko.co/media/18679/2/bb689df193.webp"}], "quizzes": [{"type": "choice", "q": "佐藤先生の説明はとても（　）ので、初心者にもよく分かった。", "opts": ["分かりやすかった", "分かりにくかった", "分かりすぎた"], "ans": 0, "exp": "連用形＋やすい＝容易～：分かりやすい→分かりやすかった。にくい＝难以～，すぎた＝过度。"}]}, {"id": "nikui", "type": "suffix", "word": "〜にくい", "read": "にくい", "group": "derive", "level": "N4", "emoji": "🌵", "meaning": "动词连用形＋にくい＝难以～、不好～", "examples": [{"jp": "この字は小さすぎて読みにくいですね。", "cn": "这字太小了，真难认。"}, {"jp": "言いにくいことですが、少し誤解があるようです。", "cn": "话有点难开口，不过好像有些误会。"}, {"jp": "この説明書は専門用語が多く、初心者には分かりにくい。", "cn": "这本说明书专业术语太多，新手很难看懂。"}, {"jp": "彼の話し方は早口で、外国人には聞き取りにくい。", "cn": "他说话语速快，对外国人来说很难听懂。"}], "note": "≠不可能（できない）：にくい＝费力、不顺手。真正不可能要用〜がたい（书面）。", "nadeshiko": [{"jp": "その<ruby>本<rt>ほん<\/rt><\/ruby> めちゃめちゃ<ruby>読<rt>よ<\/rt><\/ruby>みにくいから", "en": "That book's super hard to read,", "cn": "那本书超级难读。", "media": "My Hero Academia: Vigilantes", "ep": "EP7", "at": "0:53", "url": "https://nadeshiko.co/en/sentence/osgDHamq23Fh", "audio": "https://cdn.nadeshiko.co/media/185736/7/f17cef7d8e.mp3", "thumb": "https://cdn.nadeshiko.co/media/185736/7/f17cef7d8e.webp"}, {"jp": "しかし カクテルの<ruby>名前<rt>なまえ<\/rt><\/ruby>って わかりにくいのも<ruby>多<rt>おお<\/rt><\/ruby>いな。", "en": "A lot of cocktails have confusing names.", "cn": "不过鸡尾酒的名字，难懂的也很多啊。", "media": "Grand Blue Dreaming", "ep": "EP8", "at": "8:27", "url": "https://nadeshiko.co/en/sentence/30iSo_oA8bvl", "audio": "https://cdn.nadeshiko.co/media/100922/8/a93aa2ac6b.mp3", "thumb": "https://cdn.nadeshiko.co/media/100922/8/a93aa2ac6b.webp"}], "quizzes": [{"type": "choice", "q": "この字は小さすぎて、（　）。", "opts": ["読みにくい", "読みやすい", "読みがち"], "ans": 0, "exp": "連用形＋にくい＝难以～。やすい是其反义，がち＝动不动就～。"}]}, {"id": "gachi", "type": "suffix", "word": "〜がち", "read": "がち", "group": "derive", "level": "N3", "emoji": "🌧️", "meaning": "动词连用形／名词＋がち＝容易～、往往会～（多用于消极倾向）", "examples": [{"jp": "冬は運動不足になりがちだ。", "cn": "冬天容易缺乏运动。"}, {"jp": "最近は天気が悪くて、曇りがちの日が続いている。", "cn": "最近天气不好，阴天接连不断。"}, {"jp": "忙しさに追われると、食事が不規則になりがちである。", "cn": "一旦被忙碌追着跑，饮食就容易变得不规律。"}, {"jp" hiko.co/en/sentence/5eXpDP9OdiqM", "audio": "https://cdn.nadeshiko.co/media/166617/7/e95de4fe42.mp3", "thumb": "https://cdn.nadeshiko.co/media/166617/7/e95de4fe42.webp"}], "quizzes": [{"type": "choice", "q": "汗（　）になって試合を戦い抜いた。", "opts": ["まみれ", "だらけ", "ずくめ"], "ans": 0, "exp": "汗・血・泥等「糊在身上」的东西用まみれ；だらけ多表杂乱脏污（間違いだらけ），ずくめ＝清一色。"}]}, {"id": "darake", "type": "suffix", "word": "〜だらけ", "read": "だらけ", "group": "state", "level": "N3", "emoji": "🕸️", "meaning": "满是～、净是～（多含杂乱·脏污的贬义语感）", "examples": [{"jp": "転んで、服が泥だらけになってしまった。", "cn": "摔了一跤，衣服上沾满了泥。"}, {"jp": "この作文は間違いだらけだ。", "cn": "这篇作文错误连篇。"}, {"jp": "十年ぶりに開けた蔵の中は、ほこりだらけで足の踏み場もなかった。", "cn": "时隔十年打开的仓库里满是灰尘，连落脚的地方都没有。"}, {"jp": "彼の報告書は数字だらけで、かえって要点が分かりにくくなっている。", "cn": "他的报告书净是数字，反而让人抓不住重点。"}], "note": "贬义为主：泥・血・ほこり・間違い・借金。三兄弟辨析：だらけ＝杂乱脏污／まみれ＝糊在身上／ずくめ＝清一色（多褒义）。", "quizzes": [{"type": "choice", "q": "彼の部屋はほこり（　　）だ。", "opts": ["だらけ", "ずくめ", "がち"], "ans": 0, "exp": "脏乱的消极场面用だらけ：ほこりだらけ＝满是灰尘。褒义才轮到ずくめ。"}], "nadeshiko": [{"jp": "うわっ <ruby>専門用語<rt>せんもんようご<\/rt><\/ruby>だらけだ。", "en": "Ugh, this is full of jargon.", "cn": "呜哇，全是专业术语。", "media": "The Many Sides of Voice Actor Radio", "ep": "EP8", "at": "9:01", "url": "https://nadeshiko.co/en/sentence/Ci56fTdz5b47", "audio": "https://cdn.nadeshiko.co/media/159039/8/e3cd054ab3.mp3", "thumb": "https://cdn.nadeshiko.co/media/159039/8/e3cd054ab3.webp"}, {"jp": "す... すげえ <ruby>傷<rt>きず<\/rt><\/ruby>だらけだぜ", "en": "Awesome. He's covered with scars!", "cn": "好、好厉害，遍体鳞伤啊。", "media": "Yu Yu Hakusho: Ghostfiles", "ep": "EP86", "at": "3:09", "url": "https://nadeshiko.co/en/sentence/rKE17xd4Ar7L", "audio": "https://cdn.nadeshiko.co/media/392/86/545b1589d0.mp3", "thumb": "https://cdn.nadeshiko.co/media/392/86/545b1589d0.webp"}]}, {"id": "zukume", "type": "suffix", "word": "〜ずくめ", "read": "ずくめ", "group": "state", "level": "N1", "emoji": "🖤", "meaning": "清一色～、净是～（无一例外，多用于褒义或颜色·状态）", "examples": [{"jp": "今週はいいことずくめの一週間だった。", "cn": "这一周净是好事。"}, {"jp": "彼はいつも黒ずくめの服装をしている。", "cn": "他总是一身黑的打扮。"}, {"jp": "今年は昇進や結婚など、おめでたいことずくめの一年だった。", "cn": "今年升职又结婚，是喜事连连的一年。"}, {"jp": "彼女は贅沢ずくめの生活に慣れてしまい、庶民の感覚を失った。", "cn": "她习惯了奢侈铺张的生活，失去了普通人的感觉。"}], "note": "惯用组合要整体记：いいことずくめ・ごちそうずくめ・黒ずくめ・規則ずくめ。自由造句范围比だらけ窄。", "nadeshiko": [{"jp": "いいことずくめだね", "en": "Everybody wins.", "cn": "全是好事呢。", "media": "【OSHI NO KO】Season 3", "ep": "EP8", "at": "2:51", "url": "https://nadeshiko.co/en/sentence/JAdh1o-Mbmnv", "audio": "https://cdn.nadeshiko.co/media/182587/8/4244ff65f9.mp3", "thumb": "https://cdn.nadeshiko.co/media/182587/8/4244ff65f9.webp"}, {"jp": "よくわからない　<ruby>黒<rt>くろ<\/rt><\/ruby>ずくめの<ruby>連中<rt>れんちゅう<\/rt><\/ruby>さ。", "en": "These weird guys in black robes...", "cn": "是些莫名其妙的、一身黑衣的家伙。", "media": "Clevatess", "ep": "EP5", "at": "14:54", "url": "https://nadeshiko.co/en/sentence/MzMkrJdQx1wR", "audio": "https://cdn.nadeshiko.co/media/178869/5/1c6a1c1784.mp3", "thumb": "https://cdn.nadeshiko.co/media/178869/5/1c6a1c1784.webp"}], "quizzes": [{"type": "choice", "q": "彼女は赤（　）のドレスを身にまとって現れた。", "opts": ["ずくめ", "だらけ", "まみれ"], "ans": 0, "exp": "ずくめ＝清一色（颜色・好事等，偏中性／褒义）；だらけ・まみれ带杂乱脏污的贬义。"}]}, {"id": "gariya", "type": "suffix", "word": "〜がり屋", "read": "がりや", "group": "derive", "level": "N2", "emoji": "🎭", "meaning": "い-词干 / ます-词干 ＋ がり屋 ＝「爱～的人、好～的人」：把倾向性变成指人的名词", "examples": [{"jp": "彼女は寂しがり屋だから、そばにいてあげて。", "cn": "她是个怕寂寞的人，你多陪陪她吧。"}, {"jp": "弟は恥ずかしがり屋で、人前ではなかなか喋れない。", "cn": "弟弟很害羞，在人前总是说不上话。"}, {"jp": "彼は強がり屋だけど、本当は寂しがり屋だ。", "cn": "他虽然逞强，其实很怕寂寞。"}, {"jp": "彼女は怒りがり屋だから、少し注意が必要だ。", "cn": "她容易发脾气，需要稍微注意一点。"}, {"jp": "彼は寒がり屋だから、冬はフランネルシャツを着る。", "cn": "他怕冷，冬天会穿法兰绒衬衫。"}, {"jp": "妹は甘えがり屋で、いつも私にかまってほしがる。", "cn": "妹妹很爱撒娇，总是要我陪她。"}, {"jp": "彼女は暑がり屋だから、夏はエアコンが欠かせない。", "cn": "她怕热，夏天离不开空调。"}, {"jp": "試験中に緊張がりやになるのは自然なことだ。", "cn": "考试时容易紧张是很自然的事。"}, {"jp": "彼は怖がり屋のくせに、ホラー映画を見たがる。", "cn": "他明明是个胆小鬼，却偏偏想看恐怖片。"}], "note": "构成：い-词干＋がり屋（暑い→暑がり屋＝怕热的人）；ます-词干＋がり屋（走る→走りがり屋＝爱跑步的人）。～がり屋は N2 级接尾辞，日常会话高频，用法活泼。", "nadeshiko": [{"jp": "2<ruby>人<rt>ふたり<\/rt><\/ruby>とも<ruby>寂<rt>さび<\/rt><\/ruby>しがり<ruby>屋<rt>や<\/rt><\/ruby>の <ruby>意地<rt>いじ<\/rt><\/ruby>っ<ruby>張<rt>ぱ<\/rt><\/ruby>りだから", "en": "You're both lonely, but too stubborn to admit it,", "cn": "你们两个都是又怕寂寞又倔强。", "media": "WITCH WATCH", "ep": "EP4", "at": "20:48", "url": "https://nadeshiko.co/en/sentence/a2X-UCGFzhCl", "audio": "https://cdn.nadeshiko.co/media/180367/4/307a274a0e.mp3", "thumb": "https://cdn.nadeshiko.co/media/180367/4/307a274a0e.webp"}, {"jp": "<ruby>恥<rt>は<\/rt><\/ruby>ずかしがり<ruby>屋<rt>や<\/rt><\/ruby>さんなんじゃから もう", "en": "They must be shy. What a nuisance.", "cn": "真是个害羞的家伙，真是的。", "media": "Mushoku Tensei: Jobless Reincarnation", "ep": "EP8", "at": "19:34", "url": "https://nadeshiko.co/en/sentence/ez0B0XNhpUuL", "audio": "https://cdn.nadeshiko.co/media/108465/8/d40223dcbe.mp3", "thumb": "https://cdn.nadeshiko.co/media/108465/8/d40223dcbe.webp"}], "quizzes": [{"type": "choice", "q": "弟は（　）で、一人で留守番ができない。", "opts": ["寂しがり屋", "寂しい屋", "寂し者"], "ans": 0, "exp": "い-词干＋がり屋＝爱…的人：寂しがり屋＝怕寂寞的人；恥ずかしがり屋＝害羞的人。"}]}, {"id": "ha", "type": "suffix", "word": "〜派", "read": "は", "group": "derive", "level": "N3", "emoji": "🏴", "meaning": "～派、～流派、～一方：指持某种主张、风格或倾向的人群或路线", "examples": [{"jp": "会議では改革派と保守派が激しく対立した。", "cn": "会议上改革派和保守派激烈对立。"}, {"jp": "彼は行動派で、考えすぎずにすぐ実行に移す。", "cn": "他是行动派，不会想太多马上付诸行动。"}, {"jp": "私は安定派だから、起業なんて怖くてできない。", "cn": "我属于求稳派，创业什么的不敢想。"}, {"jp": "このアニメはリアル派とファンタジー派で好きが分かれる。", "cn": "这部动画在写实派和奇幻派之间各有拥趸。"}, {"jp": "有資格者は筆記試験で筆頭派を爭った。", "cn": "有资格的人在笔试中争夺榜首。（争い）"}, {"jp": "彼女は理论派で、データなしに结论を出さない。", "cn": "她是理论派，没有数据不会下结论。"}, {"jp": "彼は党内で改革派と目されながらも、選挙では保守派の支持も失わないよう巧みに立ち回った。", "cn": "他虽然被视为党内的改革派，却在选举中巧妙周旋，不失去保守派的支持。"}], "note": "派（は）表「流派、派别」：改革派・保守派・行動派・安定派等。常配「A派 vs B派」的对立结构。也用于审美/喜好分野：リアル派 vs ファンタジー派。", "nadeshiko": [{"jp": "<ruby>伯爵<rt>はくしゃく<\/rt><\/ruby>は<ruby>保守派<rt>ほしゅは<\/rt><\/ruby>の<ruby>領袖<rt>りょうしゅう<\/rt><\/ruby>。", "en": "The count is a conservative leader.", "cn": "伯爵是保守派的领袖。", "media": "The Magical Revolution of the Reincarnated Princess and the Genius Young Lady", "ep": "EP3", "at": "11:51", "url": "https://nadeshiko.co/en/sentence/MogB9oYjypFP", "audio": "https://cdn.nadeshiko.co/media/153629/3/c5d5213bfc.mp3", "thumb": "https://cdn.nadeshiko.co/media/153629/3/c5d5213bfc.webp"}, {"jp": "<ruby>教会<rt>きょうかい<\/rt><\/ruby><ruby>改革派<rt>かいかくは<\/rt><\/ruby>に<ruby>流通<rt>りゅうつう<\/rt><\/ruby>させる<ruby>構<rt>かま<\/rt><\/ruby>えだ", "en": "we will use the Reformation to distribute it.", "cn": "打算通过教会改革派来流通。", "media": "Orb: On the Movements of the Earth", "ep": "EP18", "at": "22:10", "url": "https://nadeshiko.co/en/sentence/TCjTkXydBtV1", "audio": "https://cdn.nadeshiko.co/media/151514/18/c6b78e12ca.mp3", "thumb": "https://cdn.nadeshiko.co/media/151514/18/c6b78e12ca.webp"}], "quizzes": [{"type": "choice", "q": "彼は（　）で、データより経験を重視する。", "opts": ["経験派", "経験家", "経験者"], "ans": 0, "exp": "〜派＝持某种主张／风格的一群人：経験派＝重视经验的一派。家指专业造诣者，者指有此经验的人。"}]}, {"id": "zoku", "type": "suffix", "word": "〜族", "read": "ぞく", "group": "derive", "level": "N3", "emoji": "👨‍👩‍👧‍👦", "meaning": "～族、～人群：指具有共同特征、生活方式或行为模式的一类人", "examples": [{"jp": "彼女は典型的なギャル族だった。", "cn": "她是典型的辣妹族。"}, {"jp": "都会にはワンルーム族が増えている。", "cn": "都市里独居小套房的人越来越多了。"}, {"jp": "ネット族の間ではそのニュースが瞬く間に広まった。", "cn": "在网络族之间那条新闻迅速传开了。"}, {"jp": "彼は朝は食べない「朝ご飯抜き族」だ。", "cn": "他是早上不吃早饭的「早饭skip族」。"}, {"jp": "電車の中で漫画を読む漫画族は珍しくない。", "cn": "在电车上看漫画的漫画族并不罕见。"}, {"jp": "彼女は毎日コンビニで饭を買う「コンビニ族」だ。", "cn": "她每天都在便利店买饭，是「便利店族」。"}, {"jp": "近年は、スマートフォンなしでは生活できない「スマホ依存族」が社会問題視されている。", "cn": "近年来，离开手机就无法生活的「手机依赖族」被视为社会问题。"}], "note": "族（ぞく）表「具有共同特征的一类人」：ギャル族・ネット族・ワンルーム族等。近年流行语中频繁出现新族名，多带自嘲或社会观察语感。", "nadeshiko": [{"jp": "ただの<ruby>暴走族<rt>ぼうそうぞく<\/rt><\/ruby>かと<ruby>思<rt>おも<\/rt><\/ruby>われますが", "en": "They seem to be an ordinary biker gang, sir.", "cn": "看起来只是普通的暴走族。", "media": "Akira", "ep": "EP1", "at": "15:30", "url": "https://nadeshiko.co/en/sentence/2ZYa2FwKHX1L", "audio": "https://cdn.nadeshiko.co/media/47/1/eaee1dd6dc.mp3", "thumb": "https://cdn.nadeshiko.co/media/47/1/eaee1dd6dc.webp"}, {"jp": "<ruby>力<rt>ちから<\/rt><\/ruby>ある<ruby>大狼<rt>おおがみ<\/rt><\/ruby><ruby>族<rt>ぞく<\/rt><\/ruby>と <ruby>知恵<rt>ちえ<\/rt><\/ruby>を<ruby>持<rt>も<\/rt><\/ruby>つ<ruby>妖狐族<rt>ようこぞく<\/rt><\/ruby>", "en": "The powerful clan of the Great Wolves and the wise clan of the Spirit Foxes...", "cn": "拥有力量的大狼族，与拥有智慧的妖狐族。", "media": "The Eminence in Shadow Season 2", "ep": "EP6", "at": "18:45", "url": "https://nadeshiko.co/en/sentence/hm3JnZn8q2kl", "audio": "https://cdn.nadeshiko.co/media/161964/6/8ad321dc98.mp3", "thumb": "https://cdn.nadeshiko.co/media/161964/6/8ad321dc98.webp"}], "quizzes": [{"type": "choice", "q": "休日は家にこもりがちな若者を、俗に「インドア（　）」と呼ぶことがある。", "opts": ["族", "派", "系"], "ans": 0, "exp": "〜族＝具有共同特征／生活方式的一类人；派＝主张・流派，系＝类型・体系。"}]}, {"id": "ryuu", "type": "suffix", "word": "〜流", "read": "りゅう", "group": "derive", "level": "N3", "emoji": "🎏", "meaning": "～风格、～流派、～做法：接在名词后表示某种特有的方式或传承的流派", "examples": [{"jp": "彼は自分流の勉強法を編み出した。", "cn": "他摸索出了自己独有的学习方法。"}, {"jp": "この寺は日本庭園の伝統流を今に伝えている。", "cn": "这座寺庙至今传承着日本庭园的传统流派。"}, {"jp": "母亲の料理はどこかこだわり流だ。", "cn": "妈妈的做菜方式总带着一股讲究的劲儿。"}, {"jp": "彼は武道の古流を十年以上修行している。", "cn": "他修习武术古流超过十年了。"}, {"jp": "私は大衆流だから、流行りの服はあまり買わない。", "cn": "我属于大众流，不太买流行的衣服。"}, {"jp": "彼女は三行流の生活を実践している。", "cn": "她践行着「三行极简」的生活方式。"}, {"jp": "彼は独学で身につけた自分流のギター奏法を、後輩たちに惜しみなく教えている。", "cn": "他把自学掌握的自成一派的吉他弹法，毫不吝惜地教给后辈们。"}], "note": "流（りゅう）表「风格、流派」：自分流・伝統流・古流・大衆流等。常见于武道/艺术领域（古流・新流），也活用于日常生活描述个人做法（自分流）。", "nadeshiko": [{"jp": "<ruby>司波<rt>しば<\/rt><\/ruby>が<ruby>長<rt>た<\/rt><\/ruby>けている<ruby>古流<rt>こりゅう<\/rt><\/ruby>の<ruby>武術<rt>ぶじゅつ<\/rt><\/ruby>には　<ruby>肉体<rt>にくたい<\/rt><\/ruby>の<ruby>強度<rt>きょうど<\/rt><\/ruby>を<ruby>高<rt>たか<\/rt><\/ruby>める<ruby>技<rt>わざ<\/rt><\/ruby>もあると<ruby>聞<rt>き<\/rt><\/ruby>く", "en": "I've heard that the old school martial art Shiba is skilled in has a technique for strengthening the body.", "cn": "听说司波擅长的古流武术中，也有提高肉体强度的技法。", "media": "The Irregular at Magic High School", "ep": "EP16", "at": "14:41", "url": "https://nadeshiko.co/en/sentence/Zz1mGURc0XVi", "audio": "https://cdn.nadeshiko.co/media/20458/16/fd835cf40a.mp3", "thumb": "https://cdn.nadeshiko.co/media/20458/16/fd835cf40a.webp"}, {"jp": "でも これ<ruby>我流<rt>がりゅう<\/rt><\/ruby>でしょ。", "en": "But this is your own invention, isn't it?", "cn": "但这可是你自己独创的吧。", "media": "Frieren: Beyond Journey’s End", "ep": "EP20", "at": "9:54", "url": "https://nadeshiko.co/en/sentence/3FY2PYB2KMrQ", "audio": "https://cdn.nadeshiko.co/media/154587/20/9e529d16f4.mp3", "thumb": "https://cdn.nadeshiko.co/media/154587/20/9e529d16f4.webp"}], "quizzes": [{"type": "choice", "q": "彼の泳ぎ方は我（　）で、誰にも教わっていない。", "opts": ["流", "派", "系"], "ans": 0, "exp": "〜流＝风格・流派・做法：我流＝自己独创的做法。派＝派别（人群），系＝类型・体系。"}]}, {"id": "sugi", "type": "suffix", "word": "〜過ぎ", "read": "すぎ", "group": "derive", "level": "N3", "emoji": "⚠️", "meaning": "过于～、太～：接ます-词干或い-词干后，表示程度超出适当范围", "examples": [{"jp": "飲み過ぎると体に悪い。", "cn": "喝太多对身体不好。"}, {"jp": "食べ過ぎたので、お腹がいっぱいだ。", "cn": "吃太多了，肚子好撑。"}, {"jp": "彼は仕事に没頭し過ぎて、家族と話す時間がなくなった。", "cn": "他工作投入过头，和家人说话的时间都没了。"}, {"jp": "彼女は恥ずかし過ぎて、顔を赤くした。", "cn": "她太害羞了，脸都红了。"}, {"jp": "このバッグは大き過ぎて、持ち運びにくい。", "cn": "这个包太大了，不好拎。"}, {"jp": "彼は遊び過ぎて、試験に落ちてしまった。", "cn": "他玩过头，考试挂了。"}, {"jp": "彼は若い頃から飲み過ぎが原因で何度も体を壊し、ついに医者から酒を止められた。", "cn": "他年轻时因喝酒过量多次搞垮身体，最终被医生勒令戒酒。"}], "note": "构成本质：連用形＋過ぎ＝「过度～」。动词：食べ過ぎ・飲み過ぎ・働き過ぎ；形容詞：暑過ぎ・強過ぎ・大きい過ぎ。书面语可用「〜過ぎる」（動詞形）。", "nadeshiko": [{"jp": "うう おなか いっぱーい。<ruby>食<rt>た<\/rt><\/ruby>べ<ruby>過<rt>す<\/rt><\/ruby>ぎたー。", "en": "Oh, I'm so full. I think I ate too much.", "cn": "呜，肚子好饱——吃太多了。", "media": "Bakuman.", "ep": "EP20", "at": "0:03", "url": "https://nadeshiko.co/en/sentence/XUavzKqHafoP", "audio": "https://cdn.nadeshiko.co/media/7674/20/8b3a5f7a01.mp3", "thumb": "https://cdn.nadeshiko.co/media/7674/20/8b3a5f7a01.webp"}, {"jp": "まったく あいつは<ruby>飲<rt>の<\/rt><\/ruby>み<ruby>過<rt>す<\/rt><\/ruby>ぎだ", "en": "What a menace! Of course he overdid it,", "cn": "真是的，那家伙喝太多了。", "media": "My Happy Marriage", "ep": "EP5", "at": "8:25", "url": "https://nadeshiko.co/en/sentence/sCldlQdoZ1rN", "audio": "https://cdn.nadeshiko.co/media/147103/5/cc04e54d27.mp3", "thumb": "https://cdn.nadeshiko.co/media/147103/5/cc04e54d27.webp"}], "quizzes": [{"type": "choice", "q": "連日の（　）で、彼はすっかり太ってしまった。", "opts": ["食べ過ぎ", "食べすぎる", "食べ過ぎた"], "ans": 0, "exp": "連用形＋過ぎ＝过度～：食べ過ぎ・飲み過ぎ。此处作名词接「で」。"}]}, {"id": "chirasu", "type": "suffix", "word": "〜散らす", "read": "ちらす", "group": "derive", "level": "N2", "emoji": "😤", "meaning": "动词连用形＋散らす：①把东西乱丢、撒得到处都是（脱ぎ散らす·書き散らす）；②不分场合/对象地没完没了地做（怒鳴り散らす·威張り散らす）", "examples": [{"jp": "家族に怒鳴り散らす。", "cn": "对家人乱骂一通。", "src": "moji", "audio": "moji_audio/怒鳴り散らす_77874_e0_f003.mp3"}, {"jp": "上司が部下に向かって怒鳴り散らす。", "cn": "主管对着部下疯狂咆哮。"}, {"jp": "彼は機嫌が悪いと、誰彼構わず怒鳴り散らす。", "cn": "他心情不好的时候，就不分对象地到处乱骂人。"}, {"jp": "リビングに服を脱ぎ散らしたまま出かけた。", "cn": "把衣服乱扔在客厅里就出门了。"}, {"jp": "彼の噂を町中に言い散らすなんて、ひどい。", "cn": "把他的传闻在全城到处乱讲，太过分了。"}], "note": "构成本质：动词连用形＋散らす＝「失控地、四处地做」或「散落一地」。行为类：怒鳴り散らす·威張り散らす·自慢し散らす；散乱类：脱ぎ散らす·書き散らす·買い散らす。两者都带「失控・凌乱」的不快语感。", "nadeshiko": [{"jp": "いっつも<ruby>威張<rt>いば<\/rt><\/ruby>り<ruby>散<rt>ち<\/rt><\/ruby>らしてるくせに <ruby>何<rt>なん<\/rt><\/ruby>やってんだ <ruby>本部<rt>ほんぶ<\/rt><\/ruby>は", "en": "What the hell is HQ doing, other than acting all high-and-mighty?", "cn": "明明平时总是颐指气使、架子摆得老大，总部到底在干什么啊。", "media": "SPY x FAMILY Season 3", "ep": "EP11", "at": "12:48", "url": "https://nadeshiko.co/en/sentence/ovFUBg_vJ1jF", "audio": "https://cdn.nadeshiko.co/media/177937/11/06755aab64.mp3", "thumb": "https://cdn.nadeshiko.co/media/177937/11/06755aab64.webp"}, {"jp": "<ruby>麻美<rt>あさみ<\/rt><\/ruby>ちゃんに どなり<ruby>散<rt>ち<\/rt><\/ruby>らしたりとか", "en": "and the way she snapped at Mami-chan...", "cn": "还有对麻美酱又是大吼大叫什么的……", "media": "Rent-a-Girlfriend Season 2", "ep": "EP10", "at": "4:57", "url": "https://nadeshiko.co/en/sentence/d17Q-60Q3ueH", "audio": "https://cdn.nadeshiko.co/media/124410/10/4da4770d66.mp3", "thumb": "https://cdn.nadeshiko.co/media/124410/10/4da4770d66.webp"}], "quizzes": [{"type": "choice", "q": "部長は朝から部下に怒鳴り（　　）ばかりで、みんなビクビクしている。", "opts": ["散らす", "散らかす", "騒ぐ"], "ans": 0, "exp": "怒鳴り散らす＝疯狂咆哮。散らかす是「把房间弄乱」，騒ぐ是「吵闹」的意思，都不合。"}]}, {"id": "makuru", "type": "suffix", "word": "〜まくる", "read": "まくる", "group": "derive", "level": "N2", "emoji": "🔥", "meaning": "动词连用形＋まくる＝一个劲儿地、无节制地、痛快地做某事（到腻为止）", "readAudio": "moji_audio/まくる_198925730_w_f003.mp3", "examples": [{"jp": "おいしくて食べまくっている。", "cn": "因为好吃，所以一个劲儿地吃。", "src": "moji", "audio": "moji_audio/まくる_18576_e0_f003.mp3"}, {"jp": "二人はしゃべりまくって話が弾んでいる。", "cn": "两个人一个劲儿地聊，谈得很投机。", "src": "moji", "audio": "moji_audio/まくる_18577_e1_f003.mp3"}, {"jp": "連休は実家でゲームをやりまくるつもりだ。", "cn": "长假打算在老家疯狂打游戏。"}, {"jp": "彼女はパーティーで写真を撮りまくっていた。", "cn": "她在派对上狂拍照片。"}, {"jp": "せっかく来たんだから、思いっきり遊びまくろう。", "cn": "好不容易来了，就玩个痛快吧。"}], "note": "构成本质：动词连用形＋まくる＝「不受节制地、彻底地、痛快地做」。动漫日常会话高频，常配 やりまくる・食べまくる・遊びまくる・撮りまくる・モテまくる。比〜散らす更轻快中性（散らす多带失控不快；まくる多带尽兴冲劲）。", "nadeshiko": [{"jp": "<ruby>出会<rt>であ<\/rt><\/ruby>う<ruby>女性<rt>じょせい<\/rt><\/ruby>に<ruby>片<rt>かた<\/rt><\/ruby>っ<ruby>端<rt>ぱし<\/rt><\/ruby>から モテまくった<ruby>男<rt>おとこ<\/rt><\/ruby>なんです!", "en": "All of them had crushes on him!", "cn": "他可是对遇见的女孩子个个都迷倒、走到哪都受欢迎的男人！", "media": "The Disastrous Life of Saiki K.", "ep": "EP10", "at": "20:41", "url": "https://nadeshiko.co/en/sentence/_lVDihuSW87F", "audio": "https://cdn.nadeshiko.co/media/21804/10/5c3c638c78.mp3", "thumb": "https://cdn.nadeshiko.co/media/21804/10/5c3c638c78.webp"}, {"jp": "さあ <ruby>逃<rt>に<\/rt><\/ruby>げまくってやろうぜ! はい!", "en": "Now, let's run like hell! Yes.", "cn": "来吧，拼命逃个痛快！哈！", "media": "Re:ZERO -Starting Life in Another World-", "ep": "EP11", "at": "4:58", "url": "https://nadeshiko.co/en/sentence/EX-Kxu0VeYru", "audio": "https://cdn.nadeshiko.co/media/21355/11/6f1c85ccd7.mp3", "thumb": "https://cdn.nadeshiko.co/media/21355/11/6f1c85ccd7.webp"}], "quizzes": [{"type": "choice", "q": "せっかくの連休！思う存分、遊び（　　　　　）う！", "opts": ["まくる", "散らす", "尽くす"], "ans": 0, "exp": "遊びまくろう＝放开来玩个痛快。散らす是「乱丢乱撒」，尽くす是「耗尽」，都不合。"}]}, {"id": "buru", "type": "suffix", "word": "〜ぶる", "read": "ぶる", "group": "derive", "level": "N2", "emoji": "🎭", "meaning": "装做～的样子、摆～架子：明明不是那样，却故意装作那样（多含贬义）", "examples": [{"jp": "学者ぶって難しい言葉を使う人が苦手です。", "cn": "我受不了那些装成学者、净说艰深词汇的人。"}, {"jp": "母の前ではいい子ぶっている弟が嫌いです。", "cn": "我讨厌弟弟在妈妈面前卖乖的样子。"}, {"jp": "上品ぶった話し方が鼻につく。", "cn": "装得一本正经的说话方式令人讨厌。"}, {"jp": "彼は知識が乏しいくせに、何でも知っているぶって話に割り込んでくる。", "cn": "他明明没什么知识，却爱装作什么都懂地插话。"}, {"jp": "部長の前ではいかにも真面目ぶっているが、陰では誰よりも手を抜いている。", "cn": "在部长面前他装得一本正经，背地里却比谁都偷懒。"}], "note": "接名词・形容动词词干（学者ぶる・偉ぶる・上品ぶる・いい子ぶる・一人前ぶる）。「ぶる」的前提是「明明不是」：真学者不说学者ぶる。常配「～ぶって」「～ぶった」使用，带做作、卖弄的否定语感。", "quizzes": [{"type": "judge", "q": "貧乏なのに上品ぶるのはみっともない。", "ans": true, "exp": "✓ 明明没钱却装优雅，正是ぶる的典型用法。ぶる＝假装、充场面。"}], "nadeshiko": [{"jp": "<ruby>前世<rt>ぜんせい<\/rt><\/ruby>の<ruby>記憶<rt>きおく<\/rt><\/ruby>で <ruby>大人<rt>おとな<\/rt><\/ruby>ぶってただけのガキだって。", "en": "just a brat using old memories to act grown-up.", "cn": "不过是个靠前世记忆装大人的小鬼罢了。", "media": "Mushoku Tensei: Jobless Reincarnation Season 2 Part 2", "ep": "EP12", "at": "21:44", "url": "https://nadeshiko.co/en/sentence/yulWolETwvls", "audio": "https://cdn.nadeshiko.co/media/166873/12/04ac545584.mp3", "thumb": "https://cdn.nadeshiko.co/media/166873/12/04ac545584.webp"}, {"jp": "<ruby>今更<rt>いまさら<\/rt><\/ruby> <ruby>兄貴<rt>あにき<\/rt><\/ruby>ぶっても...》", "en": "Don't try to act like a big brother now...", "cn": "事到如今再摆哥哥架子也……", "media": "Grand Blue Dreaming Season 3", "ep": "EP3", "at": "20:16", "url": "https://nadeshiko.co/en/sentence/sFZhx2yvLqhZ", "audio": "https://cdn.nadeshiko.co/media/199111/3/24c6b13b51.mp3", "thumb": "https://cdn.nadeshiko.co/media/199111/3/24c6b13b51.webp"}]}, {"id": "kei", "type": "suffix", "word": "〜系", "read": "けい", "group": "derive", "level": "N2", "emoji": "🗂️", "meaning": "～系、～类型、～流派、～体系：接名词后表示属于某类型／流派／体系（理系・お笑い系・革新系）", "examples": [{"jp": "この映画は人情系で、最後は泣ける。", "cn": "这部电影是情感题材，最后能看哭。"}, {"jp": "テレビではお笑い系の番組が一番人気だ。", "cn": "电视里搞笑类的节目最受欢迎。"}, {"jp": "彼女はミステリー系の小説が大好きだ。", "cn": "她超爱推理悬疑类的小说。"}, {"jp": "私はもともと理系だったが、大学で文学に出会ってから、すっかり文系の道に進んでしまった。", "cn": "我原本是理科生，但大学时接触到文学后，就完全走上了文科的道路。"}, {"jp": "あの店は、和風系でありながらモダンな雰囲気も漂う、独特の内装で人気を集めている。", "cn": "那家店虽是和风系，却飘着现代气息，以独特的装修聚集人气。"}], "note": "接尾读けい，作「分类标签」用：文系・理系（升学的文理分科）／お笑い系・ミステリー系（题材类型）／革新系（派别）。比〜派更偏「题材・属性归类」，比〜流更口语。", "quizzes": [{"type": "judge", "q": "理系とは、理科系のことで、理工系の学問を専攻する人を指す。", "ans": true, "exp": "✓ 理系＝自然科学・工学系；与之相对的是文系（人文・社会科学系）。"}], "nadeshiko": [{"jp": "<ruby>真琴<rt>まこと<\/rt><\/ruby> <ruby>理系<rt>りけい<\/rt><\/ruby>か<ruby>文系<rt>ぶんけい<\/rt><\/ruby>か<ruby>決<rt>き<\/rt><\/ruby>めた?", "en": "Makoto, did you decide between sciences or humanities?", "cn": "真琴，你决定选理科还是文科了吗？", "media": "The Girl Who Leapt Through Time", "ep": "EP1", "at": "25:24", "url": "https://nadeshiko.co/en/sentence/9UBv2Zs-HCMQ", "audio": "https://cdn.nadeshiko.co/media/2236/1/5e6906bd54.mp3", "thumb": "https://cdn.nadeshiko.co/media/2236/1/5e6906bd54.webp"}, {"jp": "だって <ruby>文系<rt>ぶんけい<\/rt><\/ruby><ruby>眼鏡<rt>がんきょう<\/rt><\/ruby><ruby>野郎<rt>やろう<\/rt><\/ruby> <ruby>嫌<rt>きら<\/rt><\/ruby>いだもん", "en": "Well, I can't stand the bookish four-eyes type.", "cn": "因为我讨厌那种文科眼镜男嘛。", "media": "Your lie in April", "ep": "EP16", "at": "12:54", "url": "https://nadeshiko.co/en/sentence/cAVNLr3GNBhp", "audio": "https://cdn.nadeshiko.co/media/20665/16/e5df1b1da2.mp3", "thumb": "https://cdn.nadeshiko.co/media/20665/16/e5df1b1da2.webp"}]}, {"id": "kakari", "type": "suffix", "word": "〜係", "read": "がかり", "group": "place", "level": "N2", "emoji": "🧑‍💼", "meaning": "负责～的人、～担当：接名词后表示专门负责某项工作的人（受付係・会計係・食事係り）", "examples": [{"jp": "質問があれば、受付係に相談してください。", "cn": "有问题请找前台（接待）担当咨询。"}, {"jp": "今日は食事係りを務めます。", "cn": "今天我当伙食的负责人。"}, {"jp": "こちら国際電話係りの者です。", "cn": "我是负责国际电话的接线员。"}, {"jp": "文化祭では、クラスごとに配膳係や会計係を決めて、役割を分担した。", "cn": "校园文化节上，每个班都定下配餐员、会计等，分工负责。"}, {"jp": "彼女は、来場者の案内係を務めながら、会場の様子を細かく記録していた。", "cn": "她一边担任来客引导员，一边细致地记录会场情况。"}], "note": "係（かかり）接词后多浊化为がかり（受付係り＝うけつけがかり）。书面多简写成「〜係」，口语常带「〜係り」。指组织内专项负责的担当人，比「〜者」更具体（谁管哪件事分得清清楚楚）。", "quizzes": [{"type": "judge", "q": "料理係は、料理を専門に作るレストランのコックさんのことだ。", "ans": false, "exp": "✗ 〜係は組織内の「担当」で、料理係＝那个集体里负责做饭的人。专业厨师是コック（さん）。"}], "nadeshiko": [{"jp": "じゃあ この<ruby>子<rt>こ<\/rt><\/ruby>は?　<ruby>私<rt>わたくし<\/rt><\/ruby>は<ruby>記録<rt>きろく<\/rt><\/ruby><ruby>係<rt>かかり<\/rt><\/ruby>ですわ", "en": "Well what about her? It's my job to record everything.", "cn": "那么这个孩子呢？我是负责记录的。", "media": "Cardcaptor Sakura", "ep": "EP23", "at": "11:54", "url": "https://nadeshiko.co/en/sentence/aKZKWZpGhQK2", "audio": "https://cdn.nadeshiko.co/media/232/23/acc53f80c6.mp3", "thumb": "https://cdn.nadeshiko.co/media/232/23/acc53f80c6.webp"}, {"jp": "ご<ruby>機嫌<rt>きげん<\/rt><\/ruby>よう <ruby>忘<rt>わす<\/rt><\/ruby>れられていた<ruby>連絡<rt>れんらく<\/rt><\/ruby><ruby>係<rt>かかり<\/rt><\/ruby>です", "en": "Good day. I'm the messenger you forgot all about.", "cn": "您好，我是被你们忘掉的联络员。", "media": "Secrets of the Silent Witch", "ep": "EP7", "at": "22:44", "url": "https://nadeshiko.co/en/sentence/PkFwuD-8e-S1", "audio": "https://cdn.nadeshiko.co/media/179966/7/e4aaa0f792.mp3", "thumb": "https://cdn.nadeshiko.co/media/179966/7/e4aaa0f792.webp"}]}, {"id": "wazuka", "type": "prefix", "word": "わずか〜", "read": "わずか", "group": "state", "level": "N2", "emoji": "🪙", "meaning": "仅仅～、少得只有～：接在数量词或名词前，强调数量・程度之少", "examples": [{"jp": "駅までわずか5分で着きます。", "cn": "到车站只要短短5分钟。"}, {"jp": "わずかな時間も惜しんで勉強に打ち込んでいる。", "cn": "连一点点时间都珍惜地投入学习。"}, {"jp": "残りの水はわずかです。", "cn": "剩下的水只有一丁点了。"}, {"jp": "彼はわずか三年で、その分野の第一人者として認められるようになった。", "cn": "他仅用三年就被公认为该领域的第一人。"}, {"jp": "会社の売上は前年よりわずかながら増加に転じた。", "cn": "公司销售额虽增幅微小，但已转为增长。"}], "note": "「わずか＋数量」＝才、只有：「わずか＋な＋名词」＝少得可怜的一点。也可单用为副词／形容动词（値段はわずかだ），带“少得可怜”的修辞语感。", "nadeshiko": [{"jp": "わずかな<ruby>失敗<rt>しっぱい<\/rt><\/ruby>も<ruby>許<rt>ゆる<\/rt><\/ruby>されない", "en": "The smallest mistakes aren't forgiven.", "cn": "连一丝微小的失误都不被允许。", "media": "Dragon Pilot: Hisone & Masotan", "ep": "EP6", "at": "14:38", "url": "https://nadeshiko.co/en/sentence/ABiZiDxwDhLg", "audio": "https://cdn.nadeshiko.co/media/100673/6/3352fcbec2.mp3", "thumb": "https://cdn.nadeshiko.co/media/100673/6/3352fcbec2.webp"}, {"jp": "《ほんのわずかな <ruby>大切<rt>たいせつ<\/rt><\/ruby>な<ruby>前進<rt>ぜんしん<\/rt><\/ruby>》", "en": "This is the smallest, most important step forward.", "cn": "这是微不足道却又珍贵的一步前进。", "media": "The Dangers in My Heart Season 2", "ep": "EP7", "at": "22:51", "url": "https://nadeshiko.co/en/sentence/_6q2pdzdgLie", "audio": "https://cdn.nadeshiko.co/media/166216/7/fd010e6683.mp3", "thumb": "https://cdn.nadeshiko.co/media/166216/7/fd010e6683.webp"}], "quizzes": [{"type": "choice", "q": "駅まで（　）五分しかかからない。", "opts": ["わずか", "かすか", "ささやか"], "ans": 0, "exp": "わずか＋数量＝仅仅、才：わずか五分。かすか＝微弱（声音・迹象），ささやか＝微薄（多修饰贡献・礼物）。"}]}, {"id": "nashi", "type": "suffix", "word": "〜なし", "read": "なし", "group": "state", "level": "N3", "emoji": "🚫", "meaning": "没有～、不带～：接名词后表示缺少或免除某事物（砂糖なし・休みなし・文句なし）", "examples": [{"jp": "砂糖なしのコーヒーをください。", "cn": "请给我一杯不加糖的咖啡。"}, {"jp": "彼は休みなしで三日も働き続けた。", "cn": "他连轴转了三天没休息。"}, {"jp": "予告なしに会議が中止になった。", "cn": "会议毫无预告地取消了。"}, {"jp": "事前の相談なしに、彼は勝手に計画を変更してしまった。", "cn": "事先没商量，他就擅自把计划改掉了。"}, {"jp": "この料理は砂糖なしではとても食べられないほど苦い。", "cn": "这道菜苦得要是没有糖根本吃不下去。"}], "note": "接名词构成「没有…」：砂糖なし・休みなし・文句なし。延伸出「〜なしに（没有…就）」「〜なしでは〜ない（没有…就不能）」「〜なしのN」。与表「满是…」的 だらけ・まみれ・ずくめ 正好是「有无」两端。", "quizzes": [{"type": "choice", "q": "彼の発表は完璧で、文句（　　）の出来だった。", "opts": ["なし", "まみれ", "がち"], "ans": 0, "exp": "文句なし＝无可挑剔、没得说。まみれ是「沾满」，がち是「动不动就」，都不合。"}], "nadeshiko": [{"jp": "そなたの<ruby>案内<rt>あんない<\/rt><\/ruby>なしでは たどり<ruby>着<rt>つ<\/rt><\/ruby>けんな", "en": "It would be impossible to get there without you as a guide.", "cn": "没有你带路的话，根本到不了。", "media": "T・P BON", "ep": "EP3", "at": "18:22", "url": "https://nadeshiko.co/en/sentence/e9TFo0PMKPEN", "audio": "https://cdn.nadeshiko.co/media/169930/3/e7e6343aec.mp3", "thumb": "https://cdn.nadeshiko.co/media/169930/3/e7e6343aec.webp"}, {"jp": "<ruby>文句<rt>もんく<\/rt><\/ruby>なしの<ruby>立派<rt>りっぱ<\/rt><\/ruby>なお<ruby>子<rt>こ<\/rt><\/ruby>さんです", "en": "He's a fine, respectable young man.", "cn": "真是个无可挑剔的好孩子。", "media": "Assassination Classroom Second Season", "ep": "EP25", "at": "4:47", "url": "https://nadeshiko.co/en/sentence/qQjugKVfdD5w", "audio": "https://cdn.nadeshiko.co/media/21170/25/3393382d3e.mp3", "thumb": "https://cdn.nadeshiko.co/media/21170/25/3393382d3e.webp"}]}, {"id": "nuki", "type": "suffix", "word": "〜抜き", "read": "ぬき", "group": "state", "level": "N2", "emoji": "✂️", "meaning": "去掉～、免除～：接名词后表示省略、排除某事物（朝食抜き・お世辞抜き・前置き抜き）", "examples": [{"jp": "朝食抜きで学校へ行った。", "cn": "没吃早饭就去了学校。"}, {"jp": "お世辞抜きで言うと、この作品は本当に面白い。", "cn": "不奉承地说，这部作品真的很有意思。"}, {"jp": "冗談は抜きにして本題に入ろう。", "cn": "别开玩笑了，进入正题吧。"}, {"jp": "前置きは抜きにして、結論から申し上げます。", "cn": "就不客套开场白了，我直接说结论。"}, {"jp": "彼は忙しいらしく、飲み会は彼抜きで行われた。", "cn": "他似乎很忙，酒会就没等他办了。"}], "note": "接名词表示「去掉／不算～」：朝食抜き・お世辞抜き・前置き抜き。常配「〜抜きで（省去…而）」「〜抜きにして（撇开…）」「〜抜きにする（略过…）」。与 〜なし 之别：なし＝客观的「没有」；抜き＝把本该有的东西特意拿掉，更强调「省略・排除」的主观动作。", "quizzes": [{"type": "choice", "q": "時間がないので、前置き（　　）で結論から話します。", "opts": ["抜き", "まみれ", "がち"], "ans": 0, "exp": "前置き抜きで＝省去开场白。まみれ是「沾满」，がち是「动不动就」，都不合。"}], "nadeshiko": [{"jp": "まあまあ <ruby>固<rt>かた<\/rt><\/ruby>いこと<ruby>抜<rt>ぬ<\/rt><\/ruby>きでさ", "en": "Anyway, don't be so uptight.", "cn": "好了好了，别那么一本正经的。", "media": "【OSHI NO KO】Season 3", "ep": "EP5", "at": "8:32", "url": "https://nadeshiko.co/en/sentence/j9eJ_L27ZnvW", "audio": "https://cdn.nadeshiko.co/media/182587/5/c0a287a4ad.mp3", "thumb": "https://cdn.nadeshiko.co/media/182587/5/c0a287a4ad.webp"}, {"jp": "もちろん<ruby>超能力<rt>ちょうのうりょく<\/rt><\/ruby>は<ruby>抜<rt>ぬ<\/rt><\/ruby>きにしてだよ", "en": "I'm talking about you without psychic abilities.", "cn": "当然是把超能力排除在外说的哦。", "media": "The Disastrous Life of Saiki K.: Reawakened", "ep": "EP6", "at": "11:34", "url": "https://nadeshiko.co/en/sentence/6-SNNB0Sj_ff", "audio": "https://cdn.nadeshiko.co/media/112625/6/f5ae822dec.mp3", "thumb": "https://cdn.nadeshiko.co/media/112625/6/f5ae822dec.webp"}]}, {"id": "gai", "type": "suffix", "word": "〜がい", "read": "がい", "group": "derive", "level": "N2", "emoji": "💪", "meaning": "值得～、有～价值：接在动词连用形后，表示做某事有意义、有价值感", "readAudio": "moji_audio/やり甲斐_19895343_w_f003.mp3", "examples": [{"jp": "働きがいのある仕事を探す。", "cn": "找有意义（值得做）的工作。", "src": "moji", "audio": "moji_audio/働き_78969_e5_f003.mp3"}, {"jp": "やり甲斐を失う。", "cn": "失去了干劲。", "src": "moji", "audio": "moji_audio/やり甲斐_8734_e0_f003.mp3"}, {"jp": "この仕事には働きがいがある。", "cn": "这份工作有干劲（值得去做）。"}, {"jp": "この小説は読みがいがある。", "cn": "这部小说值得一读。"}, {"jp": "彼は毎日走りがいを感じてトレーニングを続けている。", "cn": "他每天都感受到跑步的价值，坚持训练。"}, {"jp": "子供と一緒に遊びがいを感じた。", "cn": "和孩子一起玩，感受到了玩的价值。"}], "note": "构成本质：連用形＋がい＝「有…的价值」。找工作→働きがい（干的价值）；好书→読みがい（读的价值）。比〜たい更客观（不是「想做」而是「做了有价值」）。另外「やりがい」是最高频搭配（やりがいのある仕事＝值得做的工作）。", "nadeshiko": [{"jp": "やりがいがあっていいだろう", "en": "It wouldn't be worthwhile otherwise.", "cn": "正因为有做头，才带劲嘛。", "media": "Fullmetal Alchemist: Brotherhood", "ep": "EP21", "at": "5:57", "url": "https://nadeshiko.co/en/sentence/Nu8cD9xj0fS5", "audio": "https://cdn.nadeshiko.co/media/5114/21/24c9ebd411.mp3", "thumb": "https://cdn.nadeshiko.co/media/5114/21/24c9ebd411.webp"}, {"jp": "<ruby>簡単<rt>かんたん<\/rt><\/ruby>すぎて やりがいに<ruby>欠<rt>か<\/rt><\/ruby>けるか?", "en": "You think simple tasks aren't worth doing?", "cn": "你是觉得太简单、不够有干头吗？", "media": "Witch Hat Atelier", "ep": "EP7", "at": "4:37", "url": "https://nadeshiko.co/en/sentence/m8d5daXQ8Pfx", "audio": "https://cdn.nadeshiko.co/media/147105/7/77682e91bc.mp3", "thumb": "https://cdn.nadeshiko.co/media/147105/7/77682e91bc.webp"}], "quizzes": [{"type": "choice", "q": "生活のためじゃなくて、やり（　　）を求めて仕事をする人もいる。", "opts": ["がい", "がち", "すぎ"], "ans": 0, "exp": "やりがい＝值得去做、做起来的价值感（やりがいのある仕事＝值得做的工作）。がち是「动不动就」，すぎ是「过度」，都不合。"}]}, {"id": "shinogi", "type": "suffix", "word": "〜しのぎ", "read": "しのぎ", "group": "derive", "level": "N2", "emoji": "⏳", "meaning": "接名词后：①打发、消磨（退屈しのぎ・暇しのぎ・暑さしのぎ）；②敷衍一时、权宜之计（その場しのぎ・一時しのぎ）", "examples": [{"jp": "退屈しのぎに、近所の公園を散歩した。", "cn": "为了打发无聊，去附近的公园散了散步。"}, {"jp": "その場しのぎの返事ばかりしていると、信用を失う。", "cn": "老是敷衍一时地回答问题，会失去信用。"}, {"jp": "一時しのぎの対策では、根本的な解決にはならない。", "cn": "权宜之计的对策无法从根本上解决问题。"}, {"jp": "暑さしのぎに、冷たい麦茶を飲んだ。", "cn": "为了消暑，喝了冰麦茶。"}], "note": "构成本质：动词「凌ぐ（しのぐ）」的连用形名词化后作接尾语，接名词＝「靠它熬过、顶一阵」。大辞林注明〔接尾語的に用いる〕：「その場―」「退屈―」。①消磨型：退屈しのぎ・暇しのぎ・暑さしのぎ（中性偏积极）；②敷衍型：その場しのぎ・一時しのぎ・当座しのぎ（贬义，只顾眼前）。", "nadeshiko": [{"jp": "<ruby>退屈<rt>たいくつ<\/rt><\/ruby>しのぎにはちょうどいい", "en": "It'll be perfect to stave the boredom.", "cn": "正好用来打发无聊。", "media": "Akudama Drive", "ep": "EP11", "at": "16:56", "url": "https://nadeshiko.co/en/sentence/qVoUaU_nz_pd", "audio": "https://cdn.nadeshiko.co/media/116566/11/0120c40464.mp3", "thumb": "https://cdn.nadeshiko.co/media/116566/11/0120c40464.webp"}, {"jp": "その<ruby>場<rt>ば<\/rt><\/ruby>しのぎの<ruby>慰<rt>なぐさ<\/rt><\/ruby>めなんか <ruby>現実<rt>げんじつ<\/rt><\/ruby>を<ruby>変<rt>か<\/rt><\/ruby>えやしない", "en": "Temporary relief from pain will never change reality.", "cn": "敷衍一时的安慰什么的，根本改变不了现实。", "media": "Orb: On the Movements of the Earth", "ep": "EP4", "at": "20:24", "url": "https://nadeshiko.co/en/sentence/oHJODgudDiq1", "audio": "https://cdn.nadeshiko.co/media/151514/4/885b27982c.mp3", "thumb": "https://cdn.nadeshiko.co/media/151514/4/885b27982c.webp"}], "quizzes": [{"type": "choice", "q": "その場（　　）の言い訳ばかりでは、誰にも信用されない。", "opts": ["しのぎ", "まぎれ", "すぎ"], "ans": 0, "exp": "その場しのぎ＝敷衍一时、权宜之计。まぎれ是「趁着混乱」，すぎ是「过度」，都不合。"}]}, {"id": "magire", "type": "suffix", "word": "〜まぎれ", "read": "まぎれ", "group": "derive", "level": "N1", "emoji": "🌫️", "meaning": "接名词或心情词后：①趁着…的混乱、顺便（どさくさ紛れ・買い物まぎれ）；②因情绪冲昏头、…之余（苦し紛れ・悔し紛れ）", "readAudio": "moji_audio/紛れ_1989101833_w_f003.mp3", "examples": [{"jp": "どさくさ紛れにうまいことをする。", "cn": "趁着混乱钻空子，浑水摸鱼。", "src": "moji", "audio": "moji_audio/紛れ_87910_e0_f003.mp3"}, {"jp": "くやし紛れに当たり散らす。", "cn": "因懊悔而乱发脾气。", "src": "moji", "audio": "moji_audio/紛れ_87914_e4_f003.mp3"}, {"jp": "買い物まぎれに、つい映画の前売り券を買ってしまった。", "cn": "趁着买东西，顺手买了电影预售票。"}, {"jp": "苦し紛れに、彼は適当な言い訳をしてしまった。", "cn": "走投无路之下，他随口找了个借口。"}], "note": "构成本质：动词「紛れる」的连用形名词化后作接尾语，多与「に」搭配作副词。①名词＋まぎれ（に）＝趁着…的混乱/顺便：どさくさ紛れに・買い物まぎれに・人混みまぎれに；②心情词（形容词词干・动词连用形）＋まぎれ（に）＝被情绪冲昏头、…之余：苦し紛れ・悔し紛れ・腹立ちまぎれ。福武国語辞典标注为「名／接尾」。", "nadeshiko": [{"jp": "ちょ... ちょっと どさくさまぎれにどこ<ruby>触<rt>さわ<\/rt><\/ruby>ってんのよ", "en": "H-H-Hold it! I never said you could touch me there!", "cn": "等、等一下，你趁乱摸哪儿呢！", "media": "Summer Pockets", "ep": "EP2", "at": "15:12", "url": "https://nadeshiko.co/en/sentence/-uRHovXpLl0R", "audio": "https://cdn.nadeshiko.co/media/143200/2/a687f8630e.mp3", "thumb": "https://cdn.nadeshiko.co/media/143200/2/a687f8630e.webp"}, {"jp": "<ruby>苦<rt>くる<\/rt><\/ruby>し<ruby>紛<rt>まぎ<\/rt><\/ruby>れのウソかもしれない", "en": "Maybe he lied out of desperation.", "cn": "也许那是走投无路时的谎言。", "media": "ODDTAXI", "ep": "EP9", "at": "1:38", "url": "https://nadeshiko.co/en/sentence/z9NMPGt5EbBE", "audio": "https://cdn.nadeshiko.co/media/128547/9/962b290666.mp3", "thumb": "https://cdn.nadeshiko.co/media/128547/9/962b290666.webp"}], "quizzes": [{"type": "choice", "q": "犯人は人混み（　　）に、姿を消した。", "opts": ["まぎれ", "しのぎ", "だらけ"], "ans": 0, "exp": "人混みまぎれに＝趁着人群拥挤混进去。しのぎ是「熬过、打发」，だらけ是「满是」，都不合。"}]}, {"id": "sufRyoku", "type": "suffix", "word": "〜力", "read": "りょく", "group": "derive", "level": "N2", "emoji": "💪", "meaning": "接在名词后，表示该方面的能力、力量", "examples": [{"jp": "自然界には我々の理解力の範囲を超えるものがある。", "cn": "自然界中存在超出我们理解力范围的事物。", "src": "moji"}, {"jp": "あなたの判断力を試す。", "cn": "测试你的判断力。", "src": "moji", "audio": "moji_audio/判断力_83603_e1_f003.mp3"}, {"jp": "その絵はあなたの想像力をみごとに表現している。", "cn": "那幅画完美地展现了你的想象力。", "src": "moji", "audio": "moji_audio/想像力_EgNsQvSMQy_e2_f003.mp3"}, {"jp": "彼の文章は説得力がある。", "cn": "他的文章很有说服力。", "src": "moji", "audio": "moji_audio/説得力_65669_e1_f003.mp3"}, {"jp": "彼は行動力のある人だ。", "cn": "他是个有行动力的人。", "src": "moji", "audio": "moji_audio/行動力_44173_e0_f003.mp3"}], "nadeshiko": [{"jp": "<ruby>犬並<rt>いぬな<\/rt><\/ruby>みの<ruby>理解力<rt>りかいりょく<\/rt><\/ruby>だと <ruby>思<rt>おも<\/rt><\/ruby>われてるな", "en": "He thinks I have the intelligence of a dog.", "cn": "他好像觉得我理解力和狗差不多。", "media": "JUJUTSU KAISEN", "ep": "EP24", "at": "17:40", "url": "https://nadeshiko.co/en/sentence/CmQ2KfYyt3c2", "audio": "https://cdn.nadeshiko.co/media/113415/24/a791599849.mp3", "thumb": "https://cdn.nadeshiko.co/media/113415/24/a791599849.webp"}, {"jp": "とっさの<ruby>判断力<rt>はんだんりょく<\/rt><\/ruby> マジですげえな", "en": "Your quick thinking is really amazing.", "cn": "你那瞬间的判断力，真是厉害啊。", "media": "Tengoku Daimakyo", "ep": "EP6", "at": "5:14", "url": "https://nadeshiko.co/en/sentence/mcGZ-QumdxbB", "audio": "https://cdn.nadeshiko.co/media/155783/6/c952d53d9e.mp3", "thumb": "https://cdn.nadeshiko.co/media/155783/6/c952d53d9e.webp"}, {"jp": "すっげえ<ruby>集中力<rt>しゅうちゅうりょく<\/rt><\/ruby> <ruby>全然<rt>ぜんぜん<\/rt><\/ruby> <ruby>聞<rt>き<\/rt><\/ruby>こえてないな", "en": "Incredible concentration. He can't even hear me.", "cn": "好强的集中力，完全听不见我说话啊。", "media": "March comes in like a lion Season 2", "ep": "EP14", "at": "8:21", "url": "https://nadeshiko.co/en/sentence/i1iD__IsEFog", "audio": "https://cdn.nadeshiko.co/media/98478/14/36861ceae7.mp3", "thumb": "https://cdn.nadeshiko.co/media/98478/14/36861ceae7.webp"}], "note": "构词：名词＋力（固定读「りょく」），表示「做某事的能力・力量」。能产性极高：理解力・記憶力・思考力・判断力・集中力・想像力・創造力・表現力・発想力・行動力・実行力・分析力・推理力・洞察力・観察力・説明力・説得力・交渉力・指導力・統率力・読解力・会話力・影響力・回復力・忍耐力・持久力・競争力…", "quizzes": [{"type": "choice", "q": "接尾語「〜力」（如 理解力・行動力）固定读作哪个？", "opts": ["りょく", "ちから", "りき", "か"], "ans": 0, "exp": "作接尾语构成能力名词时固定读「りょく」；单字「力」才读「ちから」。理解力＝りかいりょく、行動力＝こうどうりょく。"}]}, {"id": "nami", "type": "suffix", "word": "〜並み", "read": "なみ", "group": "state", "level": "N2", "emoji": "📏", "meaning": "接名词后表示与该事物同等程度：与～相当、～的水平", "examples": [{"jp": "人並みにおしゃれをする。", "cn": "打扮得和普通人一样。", "src": "moji", "audio": "moji_audio/人並み_61938_e2_f003.mp3"}, {"jp": "年は若いが、もう人並みの仕事をする。", "cn": "虽然年纪轻，但已经能顶一个人干活了。", "src": "moji", "audio": "moji_audio/人並み_61939_e3_f003.mp3"}, {"jp": "あの人たちは人並み以上の努力をしたからこそ、成功したのだ。", "cn": "正因为他们付出了超乎常人的努力，才取得了成功。", "src": "moji", "audio": "moji_audio/人並み_61940_e4_f003.mp3"}, {"jp": "彼の運転技術はプロ並みだ。", "cn": "他的驾驶技术是专业级的。"}, {"jp": "今年の夏は例年並みの暑さだそうだ。", "cn": "听说今年夏天跟往年一样热。"}], "nadeshiko": [{"jp": "<ruby>人並<rt>ひとな<\/rt><\/ruby>みに<ruby>生<rt>い<\/rt><\/ruby>きて<ruby>人並<rt>ひとな<\/rt><\/ruby>みに<ruby>努力<rt>どりょく<\/rt><\/ruby>して", "en": "If I live and try as hard as everyone else,", "cn": "像普通人一样活着，像普通人一样努力——", "media": "Mushoku Tensei: Jobless Reincarnation", "ep": "EP1", "at": "21:44", "url": "https://nadeshiko.co/en/sentence/bKioHGGWDbiN", "audio": "https://cdn.nadeshiko.co/media/108465/1/e24006d28d.mp3", "thumb": "https://cdn.nadeshiko.co/media/108465/1/e24006d28d.webp"}, {"jp": "<ruby>軍用犬<rt>ぐんようけん<\/rt><\/ruby>などの<ruby>特殊<rt>とくしゅ<\/rt><\/ruby><ruby>訓練<rt>くんれん<\/rt><\/ruby>にはー　1<ruby>頭<rt>いちとう<\/rt><\/ruby>あたり <ruby>小型<rt>こがた<\/rt><\/ruby>ミサイル<ruby>並<rt>な<\/rt><\/ruby>みの コストがかかります", "en": "Giving a war dog proper special training costs just about as much as a small missile per dog.", "cn": "给军用犬等做特殊训练，每只狗的花费相当于一枚小型导弹。", "media": "SPY×FAMILY Cour 2", "ep": "EP1", "at": "8:47", "url": "https://nadeshiko.co/en/sentence/v-bzIZjXj5JI", "audio": "https://cdn.nadeshiko.co/media/142838/1/620628fb98.mp3", "thumb": "https://cdn.nadeshiko.co/media/142838/1/620628fb98.webp"}, {"jp": "<ruby>僕<rt>ぼく<\/rt><\/ruby>のネビルレーザーは <ruby>派手<rt>はで<\/rt><\/ruby>さも<ruby>強<rt>つよ<\/rt><\/ruby>さもプロ<ruby>並<rt>な<\/rt><\/ruby>み", "en": "My Navel Laser is pro-level in looks and strength.", "cn": "我的肚脐激光，外观和威力都是专业级的。", "media": "My Hero Academia", "ep": "EP9", "at": "17:38", "url": "https://nadeshiko.co/en/sentence/GmfEjKk4Yu3F", "audio": "https://cdn.nadeshiko.co/media/21459/9/e62058b4fd.mp3", "thumb": "https://cdn.nadeshiko.co/media/21459/9/e62058b4fd.webp"}], "note": "「〜並み」主要有两支：①程度・同等（人並み・世間並み・例年並み・プロ並み・犬並み）②排列（歯並み・家並み・軒並み，意思不同）。另有「月並み」＝平凡・老套（由「每月」引申）。本卡收①。", "quizzes": [{"type": "choice", "q": "「歯並みがいい」的「〜並み」与「人並み」的「〜並み」，意思一样吗？", "opts": ["不一样：歯並み＝排列，人並み＝同等程度", "一样，都是同等程度", "一样，都是排列"], "ans": 0, "exp": "「〜並み」有两支：①程度・同等（人並み・例年並み・プロ並み）②排列（歯並み・家並み・軒並み）。本卡收的是①。"}]}, {"id": "atari", "type": "suffix", "word": "〜あたり（当たり）", "read": "あたり", "group": "order", "level": "N3", "emoji": "⚖️", "meaning": "每～、平均每～（表示分配・计算的基准）", "examples": [{"jp": "1人あたり3000円で計算しよう。", "cn": "按每人3000日元来算吧。"}, {"jp": "1日あたり8時間働く。", "cn": "平均每天工作8小时。"}, {"jp": "この農家は1ヘクタールあたり5トンの米を収穫する。", "cn": "这家农户每公顷收获5吨大米。"}, {"jp": "会費は1か月あたり2000円です。", "cn": "会费是每月2000日元。"}], "nadeshiko": [{"jp": "それって <ruby>一人当<rt>ひとりあ<\/rt><\/ruby>たり1<ruby>時間<rt>じかん<\/rt><\/ruby>ちょっとじゃねえか", "en": "That's just over an hour per person.", "cn": "那不就是每人一个多小时嘛。", "media": "Run with the Wind", "ep": "EP15", "at": "14:48", "url": "https://nadeshiko.co/en/sentence/SOTDpdUEUwxq", "audio": "https://cdn.nadeshiko.co/media/101903/15/fbb68b06c4.mp3", "thumb": "https://cdn.nadeshiko.co/media/101903/15/fbb68b06c4.webp"}, {"jp": "1<ruby>人当<rt>ひとりあ<\/rt><\/ruby>たり1<ruby>皿<rt>さら<\/rt><\/ruby>を <ruby>完食<rt>かんしょく<\/rt><\/ruby>しなければならない", "en": "of having to eat one giant serving per person instead of per group.", "cn": "必须每人吃完一盘。", "media": "mono", "ep": "EP4", "at": "16:34", "url": "https://nadeshiko.co/en/sentence/TDmDxcrTX-Wg", "audio": "https://cdn.nadeshiko.co/media/176246/4/62a72dd1f5.mp3", "thumb": "https://cdn.nadeshiko.co/media/176246/4/62a72dd1f5.webp"}], "note": "源自「当たる」（分配、摊到）的连用形「当たり」，接数量词/单位名词后表 per＝每～。注意同音「辺り」＝附近（駅の辺り），汉字与意思都不同。 例示・婉曲（＝など）の用法は「〜あたり（辺り）」の項を参照。", "quizzes": [{"type": "choice", "q": "「1人あたり3000円」和「駅のあたり」中的「あたり」意思一样吗？", "opts": ["不一样：前者是「每/平均分配」，后者是「附近」", "一样，都是附近", "一样，都是每"], "ans": 0, "exp": "「〜あたり（当たり）」源自动词当たる的连用形，表分配基准＝每～；「辺り」表附近。读音相同，汉字不同。"}]}, {"id": "gara", "type": "suffix", "word": "〜柄", "read": "がら", "group": "derive", "level": "N1", "emoji": "🧵", "meaning": "名词＋柄（がら）＝该事物的性质・身份・相互关系：仕事柄（因工作性质）、土地柄（风土）、人柄（人品）、間柄（交情）", "examples": [{"jp": "仕事柄、夜遅くまで起きていることが多い。", "cn": "因为工作性质，经常熬夜到很晚。"}, {"jp": "この辺りは土地柄、人がとても親切だ。", "cn": "这一带的风土人情使然，人们非常热情。"}, {"jp": "彼の人柄は社内でも高く評価されている。", "cn": "他的人品在公司里评价也很高。"}, {"jp": "二人は十年も付き合っている間柄だ。", "cn": "两人是交往了十年的关系。"}, {"jp": "元気ですよ。仕事柄、不規則な生活になりがちですけど。", "cn": "挺好的。虽说因为工作性质，生活容易变得不规律。"}], "note": "接尾語「〜柄（がら）」接名词后，把具体事物抽象为「性质・身份・关系」：仕事柄＝因工作性质；土地柄＝当地风土；人柄＝人品；間柄＝关系。例文「仕事柄、不規則な生活になりがち」正好串起 柄（接尾語）・不（接頭語）・がち（接尾語）三个词缀。", "quizzes": [{"type": "judge", "q": "「仕事柄」的意思是「工作的把柄」。", "ans": false, "exp": "✗ 「柄（がら）」是接尾語，接名词后表示性质/身份/关系：「仕事柄」＝因为工作性质。表示「把柄」的是「柄（え／つか）」。"}, {"type": "choice", "q": "「この辺りは（　）柄、人がおおらかだ。」に入るのは？", "opts": ["土地", "仕事", "人", "間"], "ans": 0, "exp": "土地柄＝当地的风土人情。柄接在「土地」后，表示该地方的性质。"}], "nadeshiko": [{"jp": "ノートパソコンは...<ruby>仕事柄<rt>しごとがら<\/rt><\/ruby> いつも<ruby>持<rt>も<\/rt><\/ruby>ち<ruby>歩<rt>ある<\/rt><\/ruby>いている", "en": "I do have my laptop with me. It's th roup": "negation", "level": "N2", "emoji": "🚷", "meaning": "非〜＝不属于、违背某范畴：非常識・非科学的・非公開・非現実的", "examples": [{"jp": "非常識な行動は周りに迷惑をかける。", "cn": "不合常理的行为会给周围人添麻烦。"}, {"jp": "その説明は非科学的だ。", "cn": "那个说明是不科学的。"}, {"jp": "この資料は非公開だ。", "cn": "这份资料不公开。"}, {"jp": "非現実的な計画は実行できない。", "cn": "不现实的计划无法实行。"}], "note": "接頭語「非〜」表示「不属于该范畴、违背该标准」（非常識・非科学的・非公開・非現実的）。与「不〜（缺乏性质）」「無〜（完全没有）」「未〜（尚未）」对比：非＝划到范畴之外。", "quizzes": [{"type": "judge", "q": "「非公開」的「非」表示「完全没有公开」。", "ans": false, "exp": "✗ 「非」表示不属于公开的范畴＝不对外公开；「完全没有」是「無」。「不公開」不是常用说法。"}], "nadeshiko": [{"jp": "なんて<ruby>非常識<rt>ひじょうしき<\/rt><\/ruby>な<ruby>魔法<rt>まほう<\/rt><\/ruby>ですの?", "en": "Your magic is absolutely absurd...", "cn": "多么不合常理的魔法啊！", "media": "I'm in Love with the Villainess", "ep": "EP8", "at": "21:43", "url": "https://nadeshiko.co/en/sentence/Z3csvxpm1SKo", "audio": "https://cdn.nadeshiko.co/media/158704/8/09fcc34248.mp3", "thumb": "https://cdn.nadeshiko.co/media/158704/8/09fcc34248.webp"}, {"jp": "えっ! <ruby>非現実的<rt>ひげんじつてき<\/rt><\/ruby>じゃん", "en": "Okay, now that is unrealistic!", "cn": "诶！也太不现实了吧。", "media": "Keep Your Hands Off Eizouken!", "ep": "EP5", "at": "5:29", "url": "https://nadeshiko.co/en/sentence/3EAT6XP2dQqb", "audio": "https://cdn.nadeshiko.co/media/109298/5/690fc9b09b.mp3", "thumb": "https://cdn.nadeshiko.co/media/109298/5/690fc9b09b.webp"}]}, {"id": "mi", "type": "prefix", "word": "未〜", "read": "み", "group": "negation", "level": "N2", "emoji": "⏳", "meaning": "未〜＝尚未（做完/达到）：未完成・未経験・未使用・未定", "examples": [{"jp": "この小説はまだ未完成だ。", "cn": "这部小说还没完成。"}, {"jp": "未経験の仕事に挑戦する。", "cn": "挑战没有经验的工作。"}, {"jp": "未使用の切符を返した。", "cn": "把未使用的车票退了。"}, {"jp": "出発時間は未定だ。", "cn": "出发时间未定。"}], "note": "接頭語「未〜」表示时间上「尚未」（未完成・未経験・未使用・未定）。与「不〜」不同：未＝还没有发生/达到，不＝性质上不具备。", "quizzes": [{"type": "judge", "q": "「未完成」和「不完成」都可以说。", "ans": false, "exp": "✗ 常用「未完成」。「未」表示尚未完成；「不」不接「完成」构成该词（不＋完成 非常用）。"}], "nadeshiko": [{"jp": "ルーデウス。まだ<ruby>未完成<rt>みかんせい<\/rt><\/ruby>だが", "en": "Rudeus.", "cn": "鲁迪乌斯。虽然还没完成。", "media": "Mushoku Tensei: Jobless Reincarna const $=s=>document.querySelector(s);
let curAudio=null,curBtn=null;
function play(id,btn){
  const src=AUDIO[id]||NADE_AUDIO[id];if(!src)return;
  if(curAudio){curAudio.pause();curAudio.currentTime=0;}
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('playing'));
  curAudio=new Audio(src);curBtn=btn||null;
  if(curBtn){curBtn.classList.add('playing');curAudio.onended=()=>curBtn.classList.remove('playing');}
  curAudio.play();
}
function rowHTML(sid){
  const s=SENTS[sid];
  const b=AUDIO[sid]?`<button class="btn" onclick="play('${sid}',this)">▶</button>`:"";
  const chip=s.src==="moji"?`<span class="src src-moji">MOJi</span>`:"";
  return `<div class="row">${b}<div><div class="jp">${s.jp}${chip}</div><div class="cn">${s.cn}</div></div></div>`;
}
function nadeHTML(sc,iid,idx){
  const nid=`${iid}-n${idx}`;
  const hasAudio=!!NADE_AUDIO[nid];
  const playBtn=hasAudio?`<button class="btn" style="width:30px;height:30px;font-size:13px" onclick="play('${nid}',this)">▶</button>`:"";
  return `<div class="nade-card">
    <div class="nade-hdr"><span class="src src-nade">Nadeshiko</span>
      ${playBtn}
      <span class="nade-media">${sc.media}</span><span class="nade-ep">${sc.ep} @ ${sc.at}</span></div>
    <div class="nade-row">
      <img class="nade-thumb" src="${sc.thumb}" alt="" onerror="this.style.display='none'">
      <div>
        <div class="nade-jp">${sc.jp}</div>
        <div class="nade-en">${sc.en}</div>
        <div class="nade-cn">${sc.cn}</div>
        <a href="${sc.url}" target="_blank">nadeshiko.co ↗</a>
      </div>
    </div></div>`;
}

function renderList(){
  let h=`<div class="card intro"><h2>这是一个会长大的口袋 👝</h2>
  <p>遇到新的接头词・接尾词，随手丢进来就行：打开 <code class="inline">pocket.json</code>
  照着现有格式加一条，再跑一次 <code class="inline">python3 build.py</code>——
  <b>卡片、发音、题库全部自动重新长出来</b>。</p>
  <div class="steps">
    <div><b>STEP 1 抄一条</b><br>复制现有条目，改掉 id・word・read・meaning 等字段。</div>
    <div><b>STEP 2 存盘重建</b><br>运行 python3 build.py，新例句的发音会自动合成缓存。</div>
    <div><b>STEP 3 刷新即得</b><br>index.html 是单文件成品，手机上也能直接离线打开。</div>
  </div></div>`;
  h+=GROUPS.map(g=>{
    const members=ITEMS.filter(n=>n.group===g.id);
    if(!members.length)return "";
    return `<div class="grp"><div class="grp-h" style="background:${g.color}"><h3>${g.name}</h3><span>${members.length} 词</span></div>
    <div class="mini-wrap">${members.map(n=>`
      <button class="mini" style="--g:${g.color}" onclick="goDetail('${n.id}')">
        <div class="em">${n.emoji||"📌"}</div>
        <div class="nm">${n.word} <small style="color:${g.color};font-size:10.5px">${n.level}</small></div>
        <div class="im">${shortMean(n.meaning)}</div></button>`).join("")}</div></div>`;
  }).join("");
  $("#main").innerHTML=h;
}

  let h="";
  GROUPS.forEach(g=>{
    const members=ITEMS.filter(n=>n.group===g.id);
    if(!members.length)return;
    h+=`<h3 class="sec" style="border-left:4px solid ${g.color};padding-left:8px;color:${g.color}">${g.name}</h3>`;
    members.forEach(n=>{
      const iid=n.id,tcls=n.type==="prefix"?"pfx":"sfx";
      h+=`<div class="card noun" id="n-${iid}" style="--g:${g.color};--g-bg:${g.color}14">
        <h2>${n.emoji||"📌"} ${n.word}<span class="jl">${n.level}</span></h2>
        <div class="meta"><span class="chip ${tcls}">${n.type==="prefix"?"接頭語":"接尾語"}</span>
          <code>读作 ${n.read}</code>
          ${AUDIO[iid]?`<button class="btn mini-btn" title="听词缀读音" onclick="play('${iid}',this)">▶</button>`:""}
        </div>
        <div class="meanbox">📌 <b>意思</b>　${n.meaning}</div>
        ${(n.examples||[]).map((_,i)=>rowHTML(`${iid}-e${i}`)).join("")}
        ${(n.nadeshiko&&n.nadeshiko.length)?`<h3 class="sec">🎬 原声台词</h3>`:""}
        ${(n.nadeshiko||[]).map((sc,i)=>nadeHTML(sc,iid,i)).join("")}
        ${n.note?`<div class="note">💡 ${n.note}</div>`:""}
      </div>`;
    });
  });
  $("#main").innerHTML=h;
}

/* ---------- quiz ---------- */
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
function lsGet(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function wrongBook(){return lsGet("keiji-wrong",{})}
function addWrong(ref){const w=wrongBook();w[ref]=1;lsSet("keiji-wrong",w);}
function delWrong(ref){const w=wrongBook();delete w[ref];lsSet("keiji-wrong",w);}
function wrongCount(){return Object.keys(wrongBook()).length;}

let mode=null,pool=[],order=[],qi=0,correct=0,answered=false;
function countBank(key){return QS.filter(q=>q.bank===key).length;}
function renderQuizTab(){
  if(!mode){
    showNext(false);$("#score").textContent="";
    const rows=BANKS.filter(([k])=>countBank(k)>0).map(([k,label])=>
      `<button class="opt" style="max-width:400px;margin:0 auto 10px" onclick="startQuiz('${k}')">${label} · ${countBank(k)}問</button>`).join("");
    const wc=wrongCount();
    const customHint=countBank("custom")?"":"";
    const wrongRow=wc?`<button class="opt" style="max-width:400px;margin:0 auto 10px;border-color:var(--gold)" onclick="startQuiz('wrong')">📕 错题重练 · ${wc}問<br><span style="font-size:12px;color:var(--gold)">做对即移出错题本</span></button>`:
      `<div class="hint" style="margin-bottom:10px">错题本是空的——答错的题会自动收进来 📕</div>`;
    $("#main").innerHTML=`<div class="card" style="text-align:center;padding:28px 16px">
      <div style="font-size:19px;font-weight:700;margin-bottom:4px">选择训练关卡</div>
      <div class="hint" style="margin-bottom:18px">题目由 pocket.json 自动生成 · 词条越多题库越大 · 全部随机打乱</div>
      ${rows}${customHint}${wrongRow}
      <button class="opt" style="max-width:400px;margin:0 auto 10px" onclick="startQuiz('mix')">🎲 混合交错 · 全量随机<br><span style="font-size:12px;color:var(--sub)">跨词缀交错练习，记忆更牢固</span></button>
      ${wc?`<button class="opt" style="max-width:220px;margin:14px auto 0;font-size:13px;padding:8px" onclick="if(confirm('清空错题本？')){localStorage.removeItem('keiji-wrong');renderQuizTab();}">🗑️ 清空错题本</button>`:""}
    </div>`;
    return;
  }
  startQuiz(mode);
}
function startQuiz(m){
  mode=m;
  if(m==="mix")pool=QS.slice();
  else if(m==="wrong"){const w=wrongBook();pool=QS.filter(q=>w[q.ref]);}
  else pool=QS.filter(q=>q.bank===m);
  order=shuffle(pool.map((_,x)=>x));
  qi=0;correct=0;answered=false;
  renderQ();
}
function curQ(){return pool[order[qi]];}
function renderQ(){
  const q=curQ();updateScore();
  let body="";
  if(q.type==="listen"){
    body=AUDIO[q.aid]?`<div style="text-align:center;margin:6px 0 14px">
      <button class="btn" style="width:56px;height:56px;font-size:24px;margin:auto" onclick="play('${q.aid}',this)">🔊</button>
      <div class="hint">可反复点击重听</div></div>`
      :`<div class="hint" style="text-align:center;margin-bottom:10px">（这条发音还没生成）</div>`;
  }
  let optHTML="";
  if(q.opts){
    optHTML=shuffle(q.opts.map((t,i)=>({t,ok:i===q.ans})))
      .map(o=>`<button class="opt" data-ok="${o.ok?1:0}" onclick="pick(this)">${o.t}</button>`).join("");
  }else{
    const truthy=q.ans===true;
    optHTML=`<div class="judgebtns">
      <button class="opt" data-ok="${truthy?1:0}" onclick="pick(this)">⭕ 正しい</button>
      <button class="opt" data-ok="${truthy?0:1}" onclick="pick(this)">❌ 間違い</button></div>`;
  }
  showNext(false);
  const label=mode==="mix"?"混合":mode==="wrong"?"错题本":(BANKS.find(([k])=>k===mode)||["",""])[1];
  $("#main").innerHTML=`<div class="card">
    <div class="hint">第 ${qi+1} 题 / 共 ${order.length} 题 · ${label}</div>
    <div class="q">${q.q}</div>${body}${optHTML}
    <div id="fb"></div></div>`;
}
function showNext(v){const b=$("#next");b.style.display=v?"inline-block":"none";b.disabled=!v;}
function pick(btn){
  if(answered)return;answered=true;
  const q=curQ();
  const ok=btn.dataset.ok==="1";
  if(ok)correct++;else addWrong(q.ref);
  if(ok&&mode==="wrong")delWrong(q.ref);
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.ok==="1")b.classList.add("right");});
  if(!ok)btn.classList.add("wrong");
  $("#fb").innerHTML=`<div class="exp ${ok?'ok':'ng'}">${ok?"⭕ 正解！":"❌ 惜しい！"} ${q.exp||""}</div>`;
  showNext(true);updateScore();
  window.scrollTo(0,document.body.scrollHeight);
}
function nextQ(){
  answered=false;qi++;
  if(qi>=order.length)finish();else renderQ();
}
function finish(){
  showNext(false);
  const total=order.length,pct=Math.round(correct/total*100);
  const msg=pct===100?"🏆 完璧！口袋又扎实了一分！":pct>=70?"👍 かなりいい！错题趁热打铁":"📖 詳細タブで復習してから再挑戦";
  $("#main").innerHTML=`<div class="card fin">
    <div class="big">${correct} / ${total}</div>
    <div style="font-size:20px;margin:12px 0">${msg}</div>
    <button class="next" style="display:inline-block;margin:4px" onclick="startQuiz('${mode}')">もう一度挑戦</button><br>
    <button class="opt" style="max-width:280px;margin:14px auto 0" onclick="backToBanks()">别的关卡选一选</button></div>`;
  $("#score").textContent="";$("#barinfo").textContent=`正确率 ${pct}%`;
  window.scrollTo(0,0);
}
function backToBanks(){mode=null;render();}
function updateScore(){$("#score").textContent=`✔ ${correct} / ${order.length}`;}

/* ---------- init ---------- */
function render(){
  if(tab!=="quiz")showNext(false);
  if(tab==="list")renderList();
  else if(tab==="detail")renderDetail();
  else renderQuizTab();
}
renderNav();render();
</script>
</body>
</html>
